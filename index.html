<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>研程</title>
  <meta name="description" content="研程：把科研拆成今天能做完的事。日程、习惯、课题推进与闪念，本地优先。">
  <meta name="theme-color" content="#12261C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="研程">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap">
  <style>
/* ---- base.css ---- */
/* ============================================================
   研程 — base tokens and reset
   Direction: research notebook on a quiet desk. Deep forest rail,
   warm paper canvas, serif display type, mono for dates and counts.
   ============================================================ */

:root {
  /* Color — light */
  --paper: #F4F2EC;
  --paper-deep: #ECE9E0;
  --surface: #FBFAF6;
  --surface-2: #EFEDE5;
  --surface-3: #E6E4DA;
  --ink: #17231C;
  --ink-soft: #3D4A42;
  --muted: #68746B;
  --faint: #8B958D;
  --line: #D8D7CD;
  --line-strong: #C5C6B9;
  --forest: #12261C;
  --forest-2: #1B3628;
  --accent: #2F6B4F;
  --accent-hover: #265A42;
  --accent-ink: #F7F5ED;
  --accent-soft: #DFE9E0;
  --ochre: #B77E32;
  --ochre-soft: #F2E4CC;
  --danger: #A44A3F;
  --danger-soft: #F3DDD8;
  --blue: #466A83;
  --blue-soft: #DFE7EC;
  --grid: rgba(23, 35, 28, 0.045);
  --glow: rgba(183, 126, 50, 0.08);
  --shadow: 0 18px 48px rgba(18, 38, 28, 0.13);
  --shadow-soft: 0 8px 24px rgba(18, 38, 28, 0.08);
  --rail-text: #EDEADF;
  --rail-muted: #9EB1A4;
  --rail-faint: #74897B;
  --rail-line: rgba(237, 234, 223, 0.13);
  --rail-active: rgba(237, 234, 223, 0.09);
  --overlay: rgba(8, 16, 11, 0.56);
  --check-ink: #FFFFFF;

  /* Type */
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  --text-xs: 11px;
  --text-sm: 12.5px;
  --text-base: 14.5px;
  --text-md: 16px;
  --text-lg: 20px;
  --text-xl: 28px;
  --text-display: clamp(44px, 5.4vw, 68px);

  /* Space + shape */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 9px;
  --radius-lg: 14px;
  --rail-w: 246px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1511;
    --paper-deep: #111C16;
    --surface: #14221A;
    --surface-2: #192A20;
    --surface-3: #21352A;
    --ink: #E8ECE5;
    --ink-soft: #C6D0C8;
    --muted: #96A59B;
    --faint: #75857B;
    --line: #293B30;
    --line-strong: #3A4E41;
    --forest: #07100A;
    --forest-2: #0D1C13;
    --accent: #85B99C;
    --accent-hover: #9ACCAF;
    --accent-ink: #0D1B13;
    --accent-soft: #223C2D;
    --ochre: #D6A45D;
    --ochre-soft: #3A2E1D;
    --danger: #D98A7D;
    --danger-soft: #3B221F;
    --blue: #89AEC4;
    --blue-soft: #1E303A;
    --grid: rgba(232, 236, 229, 0.035);
    --glow: rgba(214, 164, 93, 0.06);
    --shadow: 0 24px 60px rgba(0, 0, 0, 0.46);
    --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.3);
    --rail-text: #EDEADF;
    --rail-muted: #96AA9C;
    --rail-faint: #6F8375;
    --rail-line: rgba(237, 234, 223, 0.12);
    --rail-active: rgba(237, 234, 223, 0.08);
    --overlay: rgba(0, 0, 0, 0.68);
    --check-ink: #0D1B13;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --paper: #0D1511;
  --paper-deep: #111C16;
  --surface: #14221A;
  --surface-2: #192A20;
  --surface-3: #21352A;
  --ink: #E8ECE5;
  --ink-soft: #C6D0C8;
  --muted: #96A59B;
  --faint: #75857B;
  --line: #293B30;
  --line-strong: #3A4E41;
  --forest: #07100A;
  --forest-2: #0D1C13;
  --accent: #85B99C;
  --accent-hover: #9ACCAF;
  --accent-ink: #0D1B13;
  --accent-soft: #223C2D;
  --ochre: #D6A45D;
  --ochre-soft: #3A2E1D;
  --danger: #D98A7D;
  --danger-soft: #3B221F;
  --blue: #89AEC4;
  --blue-soft: #1E303A;
  --grid: rgba(232, 236, 229, 0.035);
  --glow: rgba(214, 164, 93, 0.06);
  --shadow: 0 24px 60px rgba(0, 0, 0, 0.46);
  --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.3);
  --rail-text: #EDEADF;
  --rail-muted: #96AA9C;
  --rail-faint: #6F8375;
  --rail-line: rgba(237, 234, 223, 0.12);
  --rail-active: rgba(237, 234, 223, 0.08);
  --overlay: rgba(0, 0, 0, 0.68);
  --check-ink: #0D1B13;
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100%;
  margin: 0;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  background-color: var(--paper);
  background-image:
    radial-gradient(ellipse 70% 46% at 92% -8%, var(--glow), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: auto, 32px 32px, 32px 32px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, p, figure, blockquote {
  margin: 0;
}

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.18;
  text-wrap: balance;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
  text-decoration: none;
}

svg {
  display: block;
}

.icon {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

.svg-sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

::selection {
  background: var(--accent-soft);
  color: var(--ink);
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.skip-link {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 999;
  transform: translateY(-160%);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  background: var(--forest);
  color: var(--rail-text);
  font-size: var(--text-sm);
  transition: transform 0.16s ease;
}

.skip-link:focus {
  transform: translateY(0);
}

.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 500;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.eyebrow::before {
  content: "";
  width: 18px;
  height: 1px;
  background: var(--ochre);
}

.lede {
  max-width: 62ch;
  color: var(--muted);
  font-size: var(--text-base);
  line-height: 1.75;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

[hidden] {
  display: none !important;
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

*::-webkit-scrollbar {
  width: 9px;
  height: 9px;
}

*::-webkit-scrollbar-thumb {
  background: var(--line-strong);
  border-radius: 99px;
  border: 2px solid transparent;
  background-clip: padding-box;
}

*::-webkit-scrollbar-track {
  background: transparent;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}


/* ---- layout.css ---- */
/* ============================================================
   Layout — rail, main canvas, mobile navigation
   ============================================================ */

.app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  min-height: 100vh;
  min-height: 100dvh;
}

/* ---------- Desktop rail ---------- */

.rail {
  position: sticky;
  top: 0;
  align-self: start;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  padding: 28px 20px 24px;
  color: var(--rail-text);
  background:
    radial-gradient(circle at 14% 0%, rgba(213, 166, 86, 0.15), transparent 34%),
    radial-gradient(circle at 88% 78%, rgba(72, 126, 94, 0.18), transparent 42%),
    linear-gradient(158deg, var(--forest-2) 0%, var(--forest) 58%, #09140E 100%);
  border-right: 1px solid rgba(0, 0, 0, 0.2);
}

.rail::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.2;
  background-image: linear-gradient(rgba(237, 234, 223, 0.045) 1px, transparent 1px);
  background-size: 100% 6px;
  mask-image: linear-gradient(to bottom, transparent, #000 72%);
}

.brand {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  width: fit-content;
  color: var(--rail-text);
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border: 1px solid var(--rail-line);
  border-radius: 10px;
  background: rgba(237, 234, 223, 0.035);
  color: #B6CBBB;
}

.brand-mark svg {
  width: 30px;
  height: 30px;
}

.brand-copy {
  display: flex;
  flex-direction: column;
  line-height: 1;
}

.brand-copy strong {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.brand-copy small {
  margin-top: 7px;
  color: var(--rail-muted);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.16em;
}

.rail-date {
  position: relative;
  z-index: 1;
  display: grid;
  gap: 2px;
  margin-top: 34px;
  padding: 16px 0 17px;
  border-top: 1px solid var(--rail-line);
  border-bottom: 1px solid var(--rail-line);
}

.rail-date-label {
  color: var(--rail-faint);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
}

.rail-date strong {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.04em;
}

.rail-date > span:last-child {
  color: var(--rail-muted);
  font-size: var(--text-sm);
}

.rail-nav {
  position: relative;
  z-index: 1;
  display: grid;
  gap: 3px;
  margin-top: 26px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 44px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  color: var(--rail-muted);
  font-size: var(--text-base);
  transition: color 0.16s ease, background 0.16s ease;
}

.nav-item .icon {
  width: 17px;
  height: 17px;
  opacity: 0.85;
}

.nav-item:hover {
  color: var(--rail-text);
  background: rgba(237, 234, 223, 0.045);
}

.nav-item.is-active {
  color: var(--rail-text);
  background: var(--rail-active);
}

.nav-dot {
  width: 5px;
  height: 5px;
  margin-left: auto;
  border-radius: 50%;
  background: var(--ochre);
  opacity: 0;
  transform: scale(0.4);
  transition: opacity 0.16s ease, transform 0.16s ease;
}

.nav-item.is-active .nav-dot {
  opacity: 1;
  transform: scale(1);
}

.rail-lower {
  position: relative;
  z-index: 1;
  display: grid;
  gap: 4px;
  margin-top: auto;
  padding-top: 22px;
}

.rail-pulse {
  margin-bottom: 14px;
  padding: 14px;
  border: 1px solid var(--rail-line);
  border-radius: var(--radius-md);
  background: rgba(8, 16, 11, 0.18);
}

.rail-pulse-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--rail-faint);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.rail-pulse strong {
  color: var(--rail-text);
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 500;
}

.rail-pulse p {
  margin-top: 2px;
  color: var(--rail-muted);
  font-size: 11.5px;
  line-height: 1.5;
}

.rail-pulse .progress {
  height: 3px;
  margin-top: 10px;
  background: rgba(237, 234, 223, 0.12);
}

.rail-pulse .progress > span {
  background: var(--ochre);
}

.rail-link {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 38px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  color: var(--rail-faint);
  font-size: 12.5px;
  text-align: left;
  transition: color 0.16s ease, background 0.16s ease;
}

.rail-link .icon {
  width: 16px;
  height: 16px;
}

.rail-link:hover {
  color: var(--rail-text);
  background: rgba(237, 234, 223, 0.045);
}

/* ---------- Main canvas ---------- */

.main {
  min-width: 0;
  padding: 38px clamp(24px, 4vw, 58px) 80px;
}

.view-root {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  outline: none;
}

.view-root:focus {
  outline: none;
}

.mobile-bar {
  display: none;
}

/* ---------- Mobile nav ---------- */

.fab {
  display: none;
}

.bottom-nav {
  display: none;
}

/* ---------- View headings ---------- */

.view-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  margin-bottom: 28px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
  animation: rise-in 0.42s var(--ease) both;
}

.view-head-copy {
  min-width: 0;
}

.view-title {
  margin-top: 8px;
  font-family: var(--font-display);
  font-size: var(--text-display);
  font-weight: 600;
  line-height: 1.04;
  letter-spacing: -0.015em;
}

.view-sub {
  max-width: 58ch;
  margin-top: 12px;
  color: var(--muted);
  font-size: var(--text-base);
  line-height: 1.7;
}

.view-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: none;
  padding-bottom: 4px;
}

/* ---------- Generic helpers ---------- */

.section {
  margin-top: 30px;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}

.section-title {
  font-family: var(--font-display);
  font-size: 23px;
  font-weight: 600;
}

.section-kicker {
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.text-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--accent);
  font-size: 12.5px;
  font-weight: 500;
}

.text-link .icon {
  width: 14px;
  height: 14px;
  transition: transform 0.16s ease;
}

.text-link:hover .icon {
  transform: translateX(2px);
}

@keyframes rise-in {
  from {
    opacity: 0;
    transform: translateY(9px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 1120px) {
  :root {
    --rail-w: 222px;
  }

  .rail {
    padding-inline: 16px;
  }

  .main {
    padding-inline: clamp(20px, 3.2vw, 40px);
  }
}

@media (max-width: 960px) {
  .app {
    display: block;
  }

  .rail {
    display: none;
  }

  .main {
    padding: 0 max(16px, env(safe-area-inset-left, 0px)) 112px max(16px, env(safe-area-inset-right, 0px));
  }

  .mobile-bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    padding: 12px max(16px, env(safe-area-inset-left, 0px));
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
    backdrop-filter: blur(14px) saturate(1.15);
  }

  .brand--compact {
    color: var(--ink);
  }

  .brand--compact .brand-mark {
    width: 34px;
    height: 34px;
    border-color: var(--line);
    background: var(--surface);
    color: var(--accent);
  }

  .brand--compact .brand-mark svg {
    width: 25px;
    height: 25px;
  }

  .brand--compact .brand-copy strong {
    font-size: 21px;
  }

  .brand--compact .brand-copy small {
    margin-top: 5px;
    color: var(--muted);
    font-size: 7px;
  }

  .mobile-actions {
    display: flex;
    gap: 4px;
  }

  .view-root {
    padding-top: 24px;
  }

  .view-head {
    align-items: flex-start;
    flex-direction: column;
    gap: 18px;
    margin-bottom: 22px;
    padding-bottom: 20px;
  }

  .view-actions {
    width: 100%;
    padding-bottom: 0;
  }

  .view-actions .btn--primary {
    flex: 1;
    justify-content: center;
  }

  .fab {
    position: fixed;
    right: max(20px, env(safe-area-inset-right, 0px));
    bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 76px);
    z-index: 45;
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 50%;
    background: var(--forest);
    color: var(--rail-text);
    box-shadow: 0 12px 30px rgba(8, 16, 11, 0.28);
    transition: transform 0.18s var(--ease), background 0.18s ease;
  }

  .fab .icon {
    width: 22px;
    height: 22px;
  }

  .fab:active {
    transform: scale(0.94);
  }

  .bottom-nav {
    position: fixed;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom, 0px));
    z-index: 40;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    align-items: center;
    width: min(430px, calc(100% - 28px));
    min-height: 62px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    box-shadow: 0 14px 38px rgba(18, 38, 28, 0.16);
    transform: translateX(-50%);
    backdrop-filter: blur(16px) saturate(1.2);
  }

  .bottom-item {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 2px;
    padding: 7px 0 5px;
    border-radius: 10px;
    color: var(--muted);
    font-size: 10px;
    transition: color 0.16s ease;
  }

  .bottom-item .icon {
    width: 20px;
    height: 20px;
  }

  .bottom-item.is-active {
    color: var(--accent);
  }

  .bottom-item.is-active::before {
    content: "";
    position: absolute;
    top: -1px;
    width: 16px;
    height: 2px;
    border-radius: 2px;
    background: var(--ochre);
  }

  .bottom-gap {
    display: block;
  }
}

@media (max-width: 560px) {
  .view-title {
    font-size: clamp(38px, 12vw, 52px);
  }

  .view-sub {
    font-size: 13.5px;
  }

  .section-title {
    font-size: 21px;
  }

  .main {
    padding-bottom: 108px;
  }
}


/* ---- components.css ---- */
/* ============================================================
   Components — controls, forms, lists, modal, feedback
   ============================================================ */

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 15px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
  transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s var(--ease);
}

.btn .icon {
  width: 16px;
  height: 16px;
}

.btn:active {
  transform: translateY(1px);
}

.btn--primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12) inset;
}

.btn--primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.btn--secondary {
  background: var(--surface);
  border-color: var(--line-strong);
  color: var(--ink);
}

.btn--secondary:hover {
  background: var(--surface-2);
}

.btn--ghost {
  color: var(--muted);
}

.btn--ghost:hover {
  color: var(--ink);
  background: var(--surface-2);
}

.btn--danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 35%, var(--line));
  background: var(--surface);
}

.btn--danger:hover {
  background: var(--danger-soft);
}

.btn--small {
  min-height: 32px;
  padding: 0 11px;
  font-size: 12px;
}

.btn--block {
  width: 100%;
}

.btn[disabled] {
  cursor: not-allowed;
  opacity: 0.45;
}

.icon-btn {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  color: var(--muted);
  transition: color 0.16s ease, background 0.16s ease;
}

.icon-btn .icon {
  width: 17px;
  height: 17px;
}

.icon-btn:hover {
  color: var(--ink);
  background: var(--surface-2);
}

.icon-btn--danger:hover {
  color: var(--danger);
  background: var(--danger-soft);
}

.icon-btn--small {
  width: 30px;
  height: 30px;
}

.icon-btn--small .icon {
  width: 15px;
  height: 15px;
}

/* ---------- Segmented control ---------- */

.segmented {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}

.segmented button {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 30px;
  padding: 0 11px;
  border-radius: 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  transition: background 0.16s ease, color 0.16s ease;
}

.segmented button .icon {
  width: 14px;
  height: 14px;
}

.segmented button:hover {
  color: var(--ink);
}

.segmented button.is-active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(18, 38, 28, 0.09);
}

/* ---------- Pills, badges, labels ---------- */

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 23px;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 500;
  line-height: 1.4;
  white-space: nowrap;
}

.pill--accent {
  background: var(--accent-soft);
  color: var(--accent);
}

.pill--ochre {
  background: var(--ochre-soft);
  color: var(--ochre);
}

.pill--danger {
  background: var(--danger-soft);
  color: var(--danger);
}

.pill--quiet {
  border: 1px solid var(--line);
  background: transparent;
}

.link-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 100%;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
}

.link-badge::before {
  content: "";
  width: 6px;
  height: 6px;
  flex: none;
  border-radius: 50%;
  background: var(--project, var(--accent));
}

.link-badge span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.source-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 6px;
  border: 1px solid var(--line);
  border-radius: 3px;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.05em;
  white-space: nowrap;
}

/* ---------- Progress ---------- */

.progress {
  position: relative;
  height: 6px;
  overflow: hidden;
  border-radius: 99px;
  background: var(--surface-3);
}

.progress > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--progress-color, var(--accent));
  transition: width 0.55s var(--ease);
}

.progress--thin {
  height: 3px;
}

.progress--thick {
  height: 9px;
}

.progress-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 7px;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.02em;
}

/* ---------- Completion circle ---------- */

.check {
  position: relative;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  flex: none;
  border: 1.5px solid var(--line-strong);
  border-radius: 50%;
  background: transparent;
  color: transparent;
  transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.18s var(--ease);
}

.check .icon {
  width: 12px;
  height: 12px;
  stroke-width: 2.6;
}

.check:hover {
  border-color: var(--event-color, var(--accent));
  color: color-mix(in srgb, var(--event-color, var(--accent)) 35%, transparent);
}

.check.is-done {
  border-color: var(--event-color, var(--accent));
  background: var(--event-color, var(--accent));
  color: var(--check-ink);
  animation: check-pop 0.22s var(--ease);
}

@keyframes check-pop {
  0% { transform: scale(0.82); }
  60% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

/* ---------- Forms ---------- */

.form-grid {
  display: grid;
  gap: 17px;
}

.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.field {
  display: grid;
  gap: 7px;
  min-width: 0;
}

.field > label,
.field-label {
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.01em;
}

.field-hint {
  color: var(--faint);
  font-size: 11px;
  line-height: 1.5;
}

.input,
.select,
.textarea {
  width: 100%;
  min-height: 42px;
  padding: 9px 11px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--ink);
  font-size: 13.5px;
  line-height: 1.5;
  transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
}

.textarea {
  min-height: 88px;
  resize: vertical;
}

.input:hover,
.select:hover,
.textarea:hover {
  border-color: var(--muted);
}

.input:focus,
.select:focus,
.textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
}

.input::placeholder,
.textarea::placeholder {
  color: var(--faint);
}

.select {
  appearance: none;
  padding-right: 34px;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:
    calc(100% - 16px) calc(50% - 2px),
    calc(100% - 11px) calc(50% - 2px);
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}

.input[type="date"],
.input[type="time"] {
  font-family: var(--font-mono);
  font-size: 12.5px;
}

.form-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 9px;
  margin-top: 2px;
}

.form-error {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--line));
  border-radius: var(--radius-sm);
  background: var(--danger-soft);
  color: var(--danger);
  font-size: 12px;
  line-height: 1.5;
}

.form-error .icon {
  width: 15px;
  height: 15px;
  margin-top: 1px;
}

.checkbox-line {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  color: var(--ink-soft);
  font-size: 12.5px;
  line-height: 1.5;
  cursor: pointer;
}

.checkbox-line input {
  width: 15px;
  height: 15px;
  margin: 2px 0 0;
  accent-color: var(--accent);
}

.color-choices {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.color-choice {
  position: relative;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  cursor: pointer;
}

.color-choice input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.color-choice span {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--swatch);
  transition: transform 0.16s var(--ease);
}

.color-choice:has(input:checked) {
  border-color: var(--swatch);
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--swatch);
}

.color-choice:has(input:checked) span {
  transform: scale(0.78);
}

/* ---------- Event rows ---------- */

.event-row {
  display: grid;
  grid-template-columns: 22px 58px minmax(0, 1fr) 28px;
  align-items: start;
  gap: 12px;
  padding: 13px 4px;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 74%, transparent);
  transition: background 0.16s ease;
}

.event-row:last-child {
  border-bottom: 0;
}

.event-row:hover {
  background: color-mix(in srgb, var(--surface) 55%, transparent);
}

.event-row .check {
  margin-top: 1px;
}

.event-time {
  padding-top: 1px;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.event-main {
  min-width: 0;
}

.event-title {
  display: block;
  width: 100%;
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1.5;
  text-align: left;
  transition: color 0.16s ease;
}

.event-title:hover {
  color: var(--accent);
}

.event-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 10px;
  margin-top: 4px;
  color: var(--faint);
  font-size: 10.5px;
}

.event-row.is-done .event-title {
  color: var(--faint);
  text-decoration: line-through;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

.event-row.is-done .event-time {
  color: var(--faint);
}

.event-row.is-dragging {
  opacity: 0.45;
}

.event-edit {
  margin-top: -4px;
  opacity: 0;
  transition: opacity 0.16s ease;
}

.event-row:hover .event-edit,
.event-edit:focus-visible {
  opacity: 1;
}

/* ---------- Cards and panels ---------- */

.panel {
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 13px;
}

.panel-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
}

.panel-title .icon {
  width: 16px;
  height: 16px;
  color: var(--ochre);
}

/* ---------- Empty states ---------- */

.empty {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 32px 18px;
  text-align: center;
}

.empty-mark {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  margin-bottom: 4px;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--faint);
  background: var(--surface);
}

.empty-mark .icon {
  width: 20px;
  height: 20px;
}

.empty strong {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
}

.empty p {
  max-width: 34ch;
  color: var(--faint);
  font-size: 12px;
  line-height: 1.6;
}

.empty .btn {
  margin-top: 6px;
}

/* ---------- Demo banner ---------- */

.demo-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  padding: 11px 14px;
  border: 1px solid color-mix(in srgb, var(--ochre) 30%, var(--line));
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--ochre-soft) 55%, var(--surface));
  color: var(--ink-soft);
  font-size: 12px;
  line-height: 1.5;
  animation: rise-in 0.4s var(--ease) both;
}

.demo-banner .icon {
  width: 16px;
  height: 16px;
  flex: none;
  color: var(--ochre);
}

.demo-banner p {
  min-width: 0;
}

.demo-banner strong {
  color: var(--ink);
  font-weight: 600;
}

.demo-banner--danger {
  border-color: color-mix(in srgb, var(--danger) 32%, var(--line));
  background: color-mix(in srgb, var(--danger-soft) 55%, var(--surface));
}

.demo-banner--danger .icon {
  color: var(--danger);
}

.demo-banner-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  flex: none;
}

/* ---------- Utility ---------- */

.hidden {
  display: none !important;
}

.muted {
  color: var(--muted);
}

.nowrap {
  white-space: nowrap;
}

.truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.divider {
  height: 1px;
  margin: 18px 0;
  border: 0;
  background: var(--line);
}

.stack {
  display: grid;
  gap: 10px;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}


/* ---- overlays.css ---- */
/* 研程 — modal and toast overlays */

/* ---------- Modal ---------- */

.modal-layer {
  position: fixed;
  inset: 0;
  z-index: 120;
  display: grid;
  place-items: center;
  padding: 24px;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: var(--overlay);
  backdrop-filter: blur(4px);
  animation: fade-in 0.18s ease both;
}

.modal {
  position: relative;
  display: flex;
  flex-direction: column;
  width: min(560px, 100%);
  max-height: min(88vh, 900px);
  max-height: min(88dvh, 900px);
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow);
  animation: modal-rise 0.24s var(--ease) both;
}

.modal--wide {
  width: min(760px, 100%);
}

.modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  flex: none;
  padding: 22px 24px 16px;
  border-bottom: 1px solid var(--line);
}

.modal-kicker {
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.modal-title {
  margin-top: 4px;
  font-family: var(--font-display);
  font-size: 25px;
  font-weight: 600;
  line-height: 1.3;
}

.modal-sub {
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

.modal-body {
  min-height: 0;
  overflow-y: auto;
  padding: 22px 24px;
}

.modal-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 9px;
  flex: none;
  padding: 15px 24px calc(15px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  background: var(--surface);
}

.modal-foot .modal-foot-left {
  margin-right: auto;
}

.modal-close {
  flex: none;
}

body.modal-open {
  overflow: hidden;
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modal-rise {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@media (max-width: 620px) {
  .modal-layer {
    align-items: end;
    padding: 0;
  }

  .modal,
  .modal--wide {
    width: 100%;
    max-height: 92dvh;
    border-radius: 16px 16px 0 0;
    border-bottom: 0;
    animation: sheet-rise 0.28s var(--ease) both;
  }

  .modal-head {
    padding: 20px 18px 14px;
  }

  .modal-title {
    font-size: 22px;
  }

  .modal-body {
    padding: 18px;
  }

  .modal-foot {
    padding: 13px 18px calc(13px + env(safe-area-inset-bottom, 0px));
  }

  .field-row {
    grid-template-columns: 1fr;
  }

  @keyframes sheet-rise {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
}

/* ---------- Toast ---------- */

.toast-root {
  position: fixed;
  right: 0;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  left: 0;
  z-index: 200;
  display: grid;
  justify-items: center;
  gap: 8px;
  pointer-events: none;
}

.toast {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  max-width: min(92vw, 440px);
  padding: 10px 15px;
  border: 1px solid rgba(237, 234, 223, 0.13);
  border-radius: 99px;
  background: var(--forest);
  color: var(--rail-text);
  box-shadow: 0 12px 30px rgba(8, 16, 11, 0.28);
  font-size: 12.5px;
  line-height: 1.45;
  animation: toast-in 0.26s var(--ease) both;
}

.toast .icon {
  width: 15px;
  height: 15px;
  color: #D5A656;
}

.toast.is-leaving {
  animation: toast-out 0.2s ease both;
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes toast-out {
  to {
    opacity: 0;
    transform: translateY(5px);
  }
}

@media (max-width: 960px) {
  .toast-root {
    bottom: calc(94px + env(safe-area-inset-bottom, 0px));
  }
}



/* ---- today.css ---- */
/* ============================================================
   Views — Today, Schedule, Habits, Projects, Settings
   ============================================================ */

/* ---------- Today ---------- */

.today-titleline {
  display: flex;
  align-items: flex-end;
  gap: clamp(20px, 3vw, 36px);
  flex-wrap: wrap;
}

.daily-spark {
  display: grid;
  flex: 0 1 440px;
  gap: 5px;
  min-width: 280px;
  max-width: 460px;
  padding: 12px 14px 11px;
  border: 1px solid color-mix(in srgb, var(--ochre) 30%, var(--line));
  border-radius: var(--radius-sm);
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--ochre-soft) 44%, var(--surface)), var(--surface) 72%);
  color: var(--ink);
  text-align: left;
  transition: border-color 0.16s ease, transform 0.18s var(--ease);
}

.daily-spark:hover {
  border-color: var(--ochre);
  transform: translateY(-1px);
}

.daily-spark-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.daily-spark-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--ochre);
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.08em;
}

.daily-spark-label .icon {
  width: 13px;
  height: 13px;
}

.daily-spark-text {
  display: -webkit-box;
  overflow: hidden;
  color: var(--ink-soft);
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.7;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}

.daily-spark-meta {
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9.5px;
  line-height: 1.4;
}

.daily-spark--empty {
  border-style: dashed;
  background: color-mix(in srgb, var(--surface) 84%, var(--paper));
}

.daily-spark--empty .daily-spark-text {
  display: -webkit-box;
  overflow: hidden;
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.6;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

@media (max-width: 1240px) {
  .today-titleline {
    align-items: flex-start;
  }

  .daily-spark {
    flex-basis: 100%;
    max-width: 560px;
  }
}

@media (max-width: 560px) {
  .daily-spark {
    max-width: none;
    min-width: 0;
    padding: 11px 12px;
  }

  .daily-spark-text {
    font-size: 13px;
    -webkit-line-clamp: 4;
  }
}

.today-pulse {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-bottom: 30px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  animation: rise-in 0.45s var(--ease) 0.04s both;
}

.pulse-stat {
  min-width: 0;
  padding: 15px 20px 16px;
  border-left: 1px solid var(--line);
}

.pulse-stat:first-child {
  padding-left: 0;
  border-left: 0;
}

.pulse-stat strong {
  display: block;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 500;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.pulse-stat strong small {
  margin-left: 2px;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 400;
}

.pulse-stat span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 11.5px;
}

.today-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.62fr) minmax(292px, 0.82fr);
  gap: clamp(26px, 3.4vw, 44px);
  align-items: start;
}

.today-main {
  min-width: 0;
}

.today-aside {
  display: grid;
  gap: 18px;
  min-width: 0;
}

.timeline-list {
  position: relative;
}

.timeline-event {
  position: relative;
}

.timeline-event::before {
  content: "";
  position: absolute;
  top: 35px;
  bottom: -14px;
  left: 14px;
  width: 1px;
  background: color-mix(in srgb, var(--line) 84%, transparent);
}

.timeline-event:last-child::before {
  display: none;
}

.timeline-event.is-done::before {
  background: color-mix(in srgb, var(--event-color, var(--accent)) 28%, var(--line));
}

.today-main .event-row {
  grid-template-columns: 22px 56px minmax(0, 1fr) 28px;
  padding-block: 14px;
}

.today-main .event-title {
  font-size: 14px;
}

.today-aside .panel {
  background: color-mix(in srgb, var(--surface) 86%, var(--paper));
}

.habit-mini {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
}

.habit-mini:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}

.habit-mini:first-child {
  padding-top: 0;
}

.habit-swatch {
  width: 9px;
  height: 9px;
  flex: none;
  border-radius: 50%;
  background: var(--habit-color, var(--accent));
}

.habit-mini-name {
  min-width: 0;
  flex: 1;
  color: var(--ink-soft);
  font-size: 12.5px;
  line-height: 1.4;
}

.habit-mini-name small {
  display: block;
  margin-top: 1px;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9.5px;
}

.habit-mini .check {
  width: 20px;
  height: 20px;
}

.project-mini {
  padding: 12px 0;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
  cursor: pointer;
}

.project-mini:first-child {
  padding-top: 2px;
}

.project-mini:last-child {
  padding-bottom: 2px;
  border-bottom: 0;
}

.project-mini-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.project-mini-name {
  overflow: hidden;
  color: var(--ink-soft);
  font-size: 12.5px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.project-mini-pct {
  flex: none;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 10px;
}

.project-mini .progress {
  height: 4px;
  margin-top: 7px;
}

.project-mini-next {
  margin-top: 5px;
  color: var(--faint);
  font-size: 10px;
  line-height: 1.4;
}

.week-bars {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 82px;
  padding-top: 8px;
}

.week-bar {
  display: flex;
  flex: 1;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 5px;
  height: 100%;
  min-width: 0;
}

.week-bar-track {
  position: relative;
  width: 100%;
  max-width: 24px;
  height: 58px;
  overflow: hidden;
  border-radius: 3px;
  background: var(--surface-3);
}

.week-bar-track span {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  border-radius: 3px;
  background: var(--accent);

}

.week-bar.is-today .week-bar-track {
  outline: 1px solid var(--ochre);
  outline-offset: 2px;
}

.week-bar.is-today .week-bar-track span {
  background: var(--ochre);
}

.week-bar small {
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 8.5px;
  line-height: 1;
}

.week-bar.is-today small {
  color: var(--ochre);
  font-weight: 500;
}

@media (max-width: 520px) {
  .today-pulse {
    grid-template-columns: 1fr 1fr;
  }

  .pulse-stat {
    padding: 12px 14px;
  }

  .pulse-stat:nth-child(odd) {
    padding-left: 0;
    border-left: 0;
  }

  .pulse-stat:nth-child(n + 3) {
    border-top: 1px solid var(--line);
  }

  .pulse-stat strong {
    font-size: 24px;
  }

  .today-grid {
    grid-template-columns: 1fr;
    gap: 30px;
  }

  .today-main .event-row {
    grid-template-columns: 22px 48px minmax(0, 1fr) 26px;
    gap: 9px;
  }

  .today-main .event-title {
    font-size: 13px;
  }

  .event-time {
    font-size: 10px;
  }
}


/* ---- schedule.css ---- */
/* 研程 — schedule view */

/* ---------- Schedule ---------- */

.schedule-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.date-nav {
  display: flex;
  align-items: center;
  gap: 6px;
}

.date-nav-copy {
  min-width: 172px;
  padding: 0 4px;
}

.date-nav-copy strong {
  display: block;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  line-height: 1.25;
}

.date-nav-copy span {
  display: block;
  margin-top: 2px;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
}

.schedule-wrap {
  min-width: 0;
}

.weekday-row {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border-top: 1px solid var(--line);
  border-right: 1px solid var(--line);
  border-left: 1px solid var(--line);
  background: var(--surface-2);
}

.weekday-row span {
  padding: 8px 10px;
  border-right: 1px solid var(--line);
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-align: left;
}

.weekday-row span:last-child {
  border-right: 0;
}

.weekday-row span.is-weekend {
  color: color-mix(in srgb, var(--ochre) 78%, var(--faint));
}

.month-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
  background: var(--surface);
  animation: rise-in 0.36s var(--ease) both;
}

.month-cell {
  position: relative;
  min-width: 0;
  min-height: 116px;
  padding: 7px 7px 6px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
  transition: background 0.15s ease, box-shadow 0.15s ease;
}

.month-cell:hover {
  background: var(--surface-2);
}

.month-cell.is-other {
  background: color-mix(in srgb, var(--paper-deep) 55%, var(--surface));
}

.month-cell.is-other .month-daynum {
  color: var(--faint);
}

.month-cell.is-today {
  background: color-mix(in srgb, var(--accent-soft) 44%, var(--surface));
}

.month-cell.is-drop-target {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.month-dayline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}

.month-daynum {
  display: grid;
  place-items: center;
  min-width: 23px;
  height: 23px;
  color: var(--ink-soft);
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}

.month-cell.is-today .month-daynum {
  border-radius: 50%;
  background: var(--forest);
  color: var(--rail-text);
  font-weight: 500;
}

.month-add {
  display: grid;
  place-items: center;
  width: 21px;
  height: 21px;
  border-radius: 4px;
  color: var(--faint);
  opacity: 0;
  transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
}

.month-add .icon {
  width: 13px;
  height: 13px;
}

.month-cell:hover .month-add,
.month-add:focus-visible {
  opacity: 1;
}

.month-add:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

.month-events {
  display: grid;
  gap: 3px;
  margin-top: 3px;
}

.event-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
  min-width: 0;
  padding: 3px 5px;
  border-radius: 3px;
  background: color-mix(in srgb, var(--project, var(--accent)) 13%, transparent);
  color: var(--ink-soft);
  font-size: 10.5px;
  line-height: 1.35;
  text-align: left;
  cursor: grab;
}

.event-pill::before {
  content: "";
  width: 4px;
  height: 4px;
  flex: none;
  border-radius: 50%;
  background: var(--project, var(--accent));
}

.event-pill span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.event-pill:hover {
  background: color-mix(in srgb, var(--project, var(--accent)) 22%, transparent);
}

.event-pill.is-done {
  opacity: 0.55;
}

.event-pill.is-dragging,
.week-event.is-dragging {
  opacity: 0.4;
}

.event-pill.is-done span {
  text-decoration: line-through;
}

.month-more {
  padding-left: 5px;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9px;
}

.month-dots {
  display: none;
  gap: 3px;
  margin-top: 6px;
}

.month-dots i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--project, var(--accent));
}

.week-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
  background: var(--surface);
  animation: rise-in 0.36s var(--ease) both;
}

.week-col {
  min-width: 0;
  min-height: 330px;
  padding: 10px 9px 14px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  transition: background 0.15s ease, box-shadow 0.15s ease;
}

.week-col.is-today {
  background: color-mix(in srgb, var(--accent-soft) 35%, var(--surface));
}

.week-col.is-drop-target {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.week-col-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 5px;
  min-height: 30px;
  padding-bottom: 7px;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
  margin-bottom: 7px;
}

.week-col-head button {
  color: var(--ink-soft);
  font-family: var(--font-mono);
  font-size: 10px;
  text-align: left;
}

.week-col-head button:hover {
  color: var(--accent);
}

.week-col-head strong {
  display: inline-grid;
  place-items: center;
  min-width: 24px;
  height: 24px;
  margin-left: 3px;
  font-size: 12px;
  font-weight: 500;
}

.week-col.is-today .week-col-head strong {
  border-radius: 50%;
  background: var(--forest);
  color: var(--rail-text);
}

.week-col-head span {
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 8.5px;
}

.week-col-events {
  display: grid;
  gap: 4px;
}

.week-event {
  position: relative;
  display: block;
  width: 100%;
  min-width: 0;
  padding: 6px 7px;
  border-left: 2px solid var(--project, var(--accent));
  border-radius: 0 4px 4px 0;
  background: color-mix(in srgb, var(--project, var(--accent)) 10%, var(--surface));
  color: var(--ink-soft);
  text-align: left;
  cursor: grab;
  transition: background 0.15s ease;
}

.week-event:hover {
  background: color-mix(in srgb, var(--project, var(--accent)) 18%, var(--surface));
}

.week-event strong {
  display: block;
  overflow: hidden;
  font-size: 10.5px;
  font-weight: 500;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.week-event small {
  display: block;
  margin-top: 2px;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 8.5px;
}

.week-event.is-done {
  opacity: 0.55;
}

.week-event.is-done strong {
  text-decoration: line-through;
}

.week-add {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  width: 100%;
  min-height: 26px;
  margin-top: 5px;
  border: 1px dashed transparent;
  border-radius: 4px;
  color: var(--faint);
  font-size: 9.5px;
  opacity: 0;
  transition: opacity 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.week-add .icon {
  width: 12px;
  height: 12px;
}

.week-col:hover .week-add,
.week-add:focus-visible {
  opacity: 1;
}

.week-add:hover {
  border-color: var(--line-strong);
  color: var(--accent);
}

.week-empty {
  padding: 8px 4px;
  color: var(--faint);
  font-size: 9.5px;
  line-height: 1.4;
}

.day-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 292px;
  align-items: start;
  gap: clamp(24px, 3.4vw, 40px);
}

.day-agenda {
  min-width: 0;
  animation: rise-in 0.36s var(--ease) both;
}

.day-side {
  display: grid;
  gap: 16px;
  min-width: 0;
}

.day-side-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.day-side-stats strong {
  display: block;
  font-family: var(--font-display);
  font-size: 25px;
  font-weight: 500;
  line-height: 1.2;
}

.day-side-stats span {
  display: block;
  margin-top: 2px;
  color: var(--faint);
  font-size: 10px;
}

.day-links {
  display: grid;
  gap: 10px;
  margin-top: 9px;
}

@media (max-width: 1120px) {
  .day-layout {
    grid-template-columns: 1fr;
  }

  .day-side {
    grid-template-columns: minmax(0, 1fr);
    max-width: 520px;
  }
}

.day-link-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  min-width: 0;
}

.day-link-dot {
  width: 7px;
  height: 7px;
  flex: none;
  margin-top: 5px;
  border-radius: 50%;
  background: var(--project);
}

.day-link-row strong {
  display: block;
  overflow: hidden;
  color: var(--ink-soft);
  font-size: 11.5px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.day-link-row span {
  display: block;
  margin-top: 1px;
  color: var(--faint);
  font-size: 9.5px;
  line-height: 1.4;
}

.day-date-line {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 10px;

.day-date-line::after {

.day-group-label {

}

.day-timeline .event-row {
  grid-template-columns: 22px 62px minmax(0, 1fr) 28px;
}

.schedule-empty {

  .week-col-head {

@media (max-width: 520px) {

    min-height: 60px;
  }

  .month-daynum {
    font-size: 9.5px;
  }

  .month-dots i {
    width: 4px;
    height: 4px;
  }
}

.habit-stat strong {
