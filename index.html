.habit-stat span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 11.5px;
}

.habit-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.month-nav {
  display: flex;
  align-items: center;
  gap: 4px;
}

.month-nav strong {
  min-width: 92px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-align: center;
}

.habit-list {
  border-top: 1px solid var(--line);
}

.habit-card {
  padding: 22px 0 24px;
  border-bottom: 1px solid var(--line);
  animation: rise-in 0.4s var(--ease) both;
}

.habit-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
}

.habit-identity {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  min-width: 0;
}

.habit-big-dot {
  width: 11px;
  height: 11px;
  flex: none;
  margin-top: 8px;
  border-radius: 50%;
  background: var(--habit-color);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--habit-color) 14%, transparent);
}

.habit-name {
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 600;
  line-height: 1.35;
  text-align: left;
}

.habit-name:hover {
  color: var(--accent);
}

.habit-meta-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
  margin-top: 3px;
  color: var(--faint);
  font-size: 10.5px;
}

.habit-meta-line .icon {
  width: 12px;
  height: 12px;
  color: var(--ochre);
}

.streak {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.habit-today {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}

.habit-today-label {
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.06em;
}

.habit-today .check {
  width: 30px;
  height: 30px;
}

.habit-today .check .icon {
  width: 15px;
  height: 15px;
}

.heatmap-block {
  margin-top: 16px;
  padding-left: 22px;
}

.heatmap-weekdays {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 5px;
  max-width: 540px;
  margin-bottom: 4px;
}

.heatmap-weekdays span {
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.04em;
  text-align: center;
}

.habit-heatmap {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 5px;
  max-width: 540px;
}

.habit-cell {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 1.65 / 1;
  min-width: 0;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  background: var(--surface);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 8.5px;
  line-height: 1;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
}

.habit-cell:hover:not(:disabled) {
  border-color: var(--habit-color);
  transform: translateY(-1px);
}

.habit-cell.is-done {
  border-color: var(--habit-color);
  background: var(--habit-color);
  color: #FFFFFF;
}

.habit-cell.is-today {
  box-shadow: 0 0 0 1px var(--ochre);
}

.habit-cell.is-future {
  opacity: 0.36;
  cursor: default;
}

.habit-cell.is-blank {
  border-color: transparent;
  background: transparent;
  cursor: default;
}

.habit-cell.is-done::after {
  content: "";
  position: absolute;
  right: 3px;
  bottom: 3px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
}

.habit-cell:disabled {
  cursor: default;
}

.habit-hint {
  margin-top: 8px;
  color: var(--faint);
  font-size: 10px;
  line-height: 1.5;
}

.habit-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}

@media (max-width: 640px) {
  .habit-stats {
    grid-template-columns: 1fr 1fr;
  }

  .habit-stat {
    padding: 12px 14px;
  }

  .habit-stat:nth-child(3) {
    display: none;
  }

  .habit-top {
    gap: 10px;
  }

  .habit-name {
    font-size: 18px;
  }

  .habit-today-label {
    display: none;
  }

  .heatmap-block {
    padding-left: 0;
    margin-top: 14px;
  }

  .heatmap-weekdays {
    gap: 3px;
  }

  .habit-heatmap {
    gap: 3px;
  }

  .habit-cell {
    font-size: 8px;
  }
}



/* ---- projects.css ---- */
/* 研程 — projects view and stage detail */

/* ---------- Projects ---------- */

.project-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-bottom: 26px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.project-stat {
  padding: 14px 20px;
  border-left: 1px solid var(--line);
}

.project-stat:first-child {
  padding-left: 0;
  border-left: 0;
}

.project-stat strong {
  display: block;
  font-family: var(--font-display);
  font-size: 27px;
  font-weight: 500;
  line-height: 1.2;
}

.project-stat span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 11.5px;
}

.project-list {
  display: grid;
  gap: 18px;
}

.project-card {
  position: relative;
  padding: 24px 26px 20px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  animation: rise-in 0.42s var(--ease) both;
}

.project-card::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  width: 180px;
  height: 120px;
  pointer-events: none;
  background: radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--project) 10%, transparent), transparent 70%);
}

.project-head {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}

.project-identity {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  min-width: 0;
}

.project-mark {
  width: 10px;
  height: 10px;
  flex: none;
  margin-top: 10px;
  border-radius: 2px;
  background: var(--project);
}

.project-name {
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 600;
  line-height: 1.3;
  text-align: left;
  word-break: break-word;
}

.project-name:hover {
  color: var(--accent);
}

.project-meta {
  margin-top: 4px;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.02em;
}

.project-head-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  flex: none;
}

.project-score {
  flex: none;
  min-width: 88px;
  text-align: right;
}

.project-score strong {
  display: block;
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 500;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}

.project-score strong small {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 400;
}

.project-score span {
  display: block;
  margin-top: 3px;
  color: var(--faint);
  font-size: 9.5px;
}

.project-bar {
  position: relative;
  z-index: 1;
  margin: 16px 0 18px;
}

.project-bar .progress {
  height: 7px;
  background: var(--surface-2);
}

.project-stage-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.project-stage-head span {
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.project-stage-head small {
  color: var(--faint);
  font-size: 10px;
}

.stage-scroll {
  overflow-x: auto;
  margin: 0 -4px;
  padding: 3px 4px 10px;
}

.stage-rail {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  min-width: 760px;
}

.stage {
  position: relative;
  min-width: 0;
  padding: 0 8px 0 0;
  text-align: left;
}

.stage-line {
  position: absolute;
  top: 17px;
  right: 0;
  left: 18px;
  height: 2px;
  background: var(--line);
}

.stage:last-child .stage-line {
  display: none;
}

.stage-line.is-done {
  background: color-mix(in srgb, var(--project) 70%, var(--line));
}

.stage-dot {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: var(--surface);
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9.5px;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.15s var(--ease);
}

.stage:hover .stage-dot {
  transform: translateY(-1px);
  border-color: var(--project);
  color: var(--project);
}

.stage.is-done .stage-dot {
  border-color: var(--project);
  background: var(--project);
  color: #FFFFFF;
}

.stage.is-active .stage-dot {
  border-color: var(--project);
  color: var(--project);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--project) 16%, transparent);
}

.stage.is-overdue .stage-dot {
  border-color: var(--danger);
  color: var(--danger);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 13%, transparent);
}

.stage-name {
  display: block;
  margin-top: 7px;
  overflow: hidden;
  color: var(--ink-soft);
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.stage-count {
  display: block;
  margin-top: 2px;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 8.5px;
  line-height: 1.3;
  white-space: nowrap;
}

.stage-count.is-muted {
  color: color-mix(in srgb, var(--faint) 72%, transparent);
}

.project-next {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-top: 2px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
}

.project-next-label {
  flex: none;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.project-next p {
  min-width: 0;
  color: var(--ink-soft);
  font-size: 11.5px;
  line-height: 1.5;
}

.project-next p strong {
  color: var(--ink);
  font-weight: 600;
}

.project-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
}

.project-foot .row {
  gap: 4px;
}

.project-hint {
  color: var(--faint);
  font-size: 10px;
  line-height: 1.4;
}

@media (max-width: 760px) {
  .project-stats {
    grid-template-columns: 1fr 1fr;
  }

  .project-stat {
    padding: 12px 14px;
  }

  .project-stat:nth-child(3) {
    display: none;
  }

  .project-card {
    padding: 19px 18px 16px;
  }

  .project-head {
    gap: 10px;
  }

  .project-name {
    font-size: 22px;
  }

  .project-score {
    min-width: 68px;
  }

  .project-score strong {
    font-size: 27px;
  }

  .project-head-actions {
    display: none;
  }

  .stage-rail {
    min-width: 700px;
  }

  .project-next {
    align-items: flex-start;
    flex-direction: column;
    gap: 4px;
  }

  .project-foot {
    align-items: flex-start;
    flex-direction: column;
  }
}

/* ---------- Stage detail modal ---------- */

.stage-summary {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 18px;
}

.stage-summary-main {
  min-width: 0;
}

.stage-summary-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.35;
}

.stage-summary-sub {
  margin-top: 4px;
  color: var(--faint);
  font-size: 10.5px;
  line-height: 1.5;
}

.stage-ring {
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  flex: none;
  border-radius: 50%;
  background: conic-gradient(var(--project) calc(var(--pct) * 1%), var(--surface-2) 0);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
}

.stage-ring::before {
  content: "";
  grid-area: 1 / 1;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: var(--surface);
}

.stage-ring span {
  grid-area: 1 / 1;
  z-index: 1;
}

.stage-dates {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  align-items: end;
  gap: 10px;
  margin-bottom: 20px;
}

.stage-dates .btn {
  margin-bottom: 0;
}

.stage-subhead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 2px;
}

.stage-subhead h4 {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
}

.stage-subhead span {
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9px;
}

.subtask-list {
  border-top: 1px solid var(--line);
}

.subtask-row {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr) 28px;
  align-items: start;
  gap: 10px;
  padding: 11px 2px;
  border-bottom: 1px solid var(--line);
}

.subtask-row .check {
  width: 19px;
  height: 19px;
  margin-top: 1px;
}

.subtask-row .check .icon {
  width: 10px;
  height: 10px;
}

.subtask-main {
  min-width: 0;
}

.subtask-title {
  color: var(--ink-soft);
  font-size: 12.5px;
  line-height: 1.45;
  word-break: break-word;
}

.subtask-row.is-done .subtask-title {
  color: var(--faint);
  text-decoration: line-through;
}

.subtask-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  margin-top: 3px;
  color: var(--faint);
  font-size: 9.5px;
}

.subtask-row .icon-btn {
  margin-top: -3px;
}

.subtask-add {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.subtask-add .input {
  min-height: 38px;
}

.subtask-add .input[name="title"] {
  flex: 1 1 200px;
  min-width: 0;
}

.subtask-add .input[type="date"] {
  flex: 0 1 145px;
}

.subtask-add .btn {
  min-height: 38px;
}

.stage-empty {
  display: grid;
  justify-items: center;
  gap: 7px;
  padding: 22px 16px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--paper);
  text-align: center;
}

.stage-empty strong {
  font-family: var(--font-display);
  font-size: 15px;
}

.stage-empty p {
  max-width: 36ch;
  color: var(--faint);
  font-size: 11px;
  line-height: 1.55;
}

.stage-empty .btn {
  margin-top: 3px;
}

.stage-note {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 14px;
  color: var(--faint);
  font-size: 10.5px;
  line-height: 1.55;
}

.stage-note .icon {
  width: 14px;
  height: 14px;
  margin-top: 1px;
  flex: none;
  color: var(--ochre);
}

@media (max-width: 560px) {
  .stage-dates {
    grid-template-columns: 1fr 1fr;
  }

  .stage-dates .btn {
    grid-column: 1 / -1;
    width: 100%;
  }

  .stage-ring {
    width: 56px;
    height: 56px;
    font-size: 11px;
  }

  .stage-ring::before {
    width: 44px;
    height: 44px;
  }
}



/* ---- settings.css ---- */
/* 研程 — settings and confirmation */

/* ---------- Settings ---------- */

.settings-section {
  padding-top: 18px;
  margin-top: 18px;
  border-top: 1px solid var(--line);
}

.settings-section:first-child {
  padding-top: 0;
  margin-top: 0;
  border-top: 0;
}

.settings-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 10px;
}

.settings-copy {
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.65;
}

.theme-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 10px;
}

.theme-option {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 38px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--muted);
  font-size: 11.5px;
  transition: border-color 0.16s ease, background 0.16s ease, color 0.16s ease;
}

.theme-option .icon {
  width: 14px;
  height: 14px;
}

.theme-option:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}

.theme-option.is-active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

.backup-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
}

.backup-box {
  width: 100%;
  min-height: 108px;
  margin-top: 10px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.5;
  resize: vertical;
}

.import-box {
  min-height: 78px;
}

.about-block {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 6px;
}

.about-mark {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  flex: none;
  border: 1px solid var(--line);
  border-radius: 9px;
  color: var(--accent);
  background: var(--paper);
}

.about-mark .icon {
  width: 22px;
  height: 22px;
}

.about-block strong {
  display: block;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
}

.about-block span {
  display: block;
  color: var(--faint);
  font-size: 10px;
}

.danger-zone {
  margin-top: 14px;
  padding: 13px;
  border: 1px solid color-mix(in srgb, var(--danger) 28%, var(--line));
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--danger-soft) 45%, var(--surface));
}

.danger-zone strong {
  display: block;
  color: var(--danger);
  font-size: 12px;
  font-weight: 600;
}

.danger-zone p {
  margin: 3px 0 9px;
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.55;
}

.confirm-copy {
  display: grid;
  justify-items: center;
  gap: 10px;
  padding: 8px 0 4px;
  text-align: center;
}

.confirm-icon {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--danger-soft);
  color: var(--danger);
}

.confirm-icon .icon {
  width: 22px;
  height: 22px;
}

.confirm-copy h3 {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
}

.confirm-copy p {
  max-width: 40ch;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.65;
}



/* ---- sparks.css ---- */
/* ============================================================
   Sparks — flash notes, type marks, daily reminder
   ============================================================ */

.spark-type {
  display: inline-flex;
  align-items: center;
  min-height: 21px;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 9.5px;
  font-weight: 500;
  line-height: 1.35;
  white-space: nowrap;
}

.spark-type--experience {
  background: var(--accent-soft);
  color: var(--accent);
}

.spark-type--idea {
  background: var(--ochre-soft);
  color: var(--ochre);
}

.spark-type--mood {
  background: var(--blue-soft);
  color: var(--blue);
}

.spark-type--note {
  background: var(--surface-2);
  color: var(--muted);
}

/* ---------- Overview ---------- */

.spark-stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-bottom: 24px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.spark-stat {
  min-width: 0;
  padding: 14px 20px;
  border-left: 1px solid var(--line);
}

.spark-stat:first-child {
  padding-left: 0;
  border-left: 0;
}

.spark-stat strong {
  display: block;
  font-family: var(--font-display);
  font-size: 27px;
  font-weight: 500;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.spark-stat span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 11.5px;
}

/* ---------- Filters ---------- */

.spark-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.spark-filters {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
}

.spark-filter {
  min-height: 30px;
  padding: 0 11px;
  border: 1px solid transparent;
  border-radius: 99px;
  color: var(--muted);
  font-size: 11.5px;
  transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
}

.spark-filter:hover {
  color: var(--ink);
  background: var(--surface-2);
}

.spark-filter.is-active {
  border-color: var(--line);
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(18, 38, 28, 0.08);
}

.spark-remind-filter {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--muted);
  font-size: 11px;
  white-space: nowrap;
  transition: color 0.16s ease, border-color 0.16s ease, background 0.16s ease;
}

.spark-remind-filter .icon {
  width: 14px;
  height: 14px;
}

.spark-remind-filter span {
  display: inline-grid;
  place-items: center;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 99px;
  background: var(--surface-2);
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 8.5px;
}

.spark-remind-filter:hover {
  color: var(--ink);
  border-color: var(--line-strong);
}

.spark-remind-filter.is-active {
  border-color: color-mix(in srgb, var(--ochre) 45%, var(--line));
  background: var(--ochre-soft);
  color: var(--ochre);
}

.spark-remind-filter.is-active span {
  background: var(--surface);
  color: var(--ochre);
}

/* ---------- Cards ---------- */

.spark-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: start;
  gap: 14px;
}

.spark-card {
  display: grid;
  min-width: 0;
  gap: 13px;
  padding: 17px 18px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  animation: rise-in 0.4s var(--ease) both;
  transition: border-color 0.16s ease, background 0.16s ease;
}

.spark-card:hover {
  border-color: var(--line-strong);
}

.spark-card.is-daily {
  border-color: color-mix(in srgb, var(--ochre) 38%, var(--line));
  background:
    linear-gradient(145deg, color-mix(in srgb, var(--ochre-soft) 34%, var(--surface)), var(--surface) 62%);
}

.spark-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.spark-daily-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--ochre);
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.spark-daily-badge .icon {
  width: 11px;
  height: 11px;
}

.spark-date {
  margin-left: auto;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9px;
  white-space: nowrap;
}

.spark-content {
  color: var(--ink-soft);
  font-size: 13.5px;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.spark-card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 10px;
  border-top: 1px solid color-mix(in srgb, var(--line) 76%, transparent);
}

.spark-remind-toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 26px;
  padding: 0 8px;
  border: 1px solid transparent;
  border-radius: 99px;
  color: var(--faint);
  font-size: 9.5px;
  transition: color 0.16s ease, background 0.16s ease, border-color 0.16s ease;
}

.spark-remind-toggle .icon {
  width: 13px;
  height: 13px;
}

.spark-remind-toggle:hover {
  color: var(--ochre);
  background: var(--ochre-soft);
}

.spark-remind-toggle.is-on {
  border-color: color-mix(in srgb, var(--ochre) 26%, var(--line));
  background: color-mix(in srgb, var(--ochre-soft) 58%, var(--surface));
  color: var(--ochre);
}

.spark-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}

.spark-card .icon-btn {
  width: 28px;
  height: 28px;
}

.spark-card .icon-btn .icon {
  width: 14px;
  height: 14px;
}

/* ---------- Form ---------- */

.spark-textarea {
  min-height: 150px;
  line-height: 1.75;
}

.spark-remind-line {
  align-items: flex-start;
  min-height: 42px;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper);
  transition: border-color 0.16s ease, background 0.16s ease;
}

.spark-remind-line:has(input:checked) {
  border-color: color-mix(in srgb, var(--ochre) 40%, var(--line));
  background: color-mix(in srgb, var(--ochre-soft) 42%, var(--paper));
}

.spark-remind-line > span {
  color: var(--ink-soft);
  font-size: 11.5px;
  line-height: 1.45;
}

.spark-remind-line small {
  display: block;
  margin-top: 1px;
  color: var(--faint);
  font-size: 9.5px;
}

/* ---------- Responsive ---------- */

@media (max-width: 900px) {
  .spark-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 640px) {
  .spark-stats {
    margin-bottom: 18px;
  }

  .spark-stat {
    padding: 12px 12px;
  }

  .spark-stat:first-child {
    padding-left: 0;
  }

  .spark-stat strong {
    font-size: 23px;
  }

  .spark-stat span {
    font-size: 10px;
  }

  .spark-toolbar {
    align-items: flex-start;
    flex-direction: column;
    gap: 10px;
  }

  .spark-filters {
    gap: 3px;
  }

  .spark-filter {
    min-height: 28px;
    padding: 0 9px;
    font-size: 10.5px;
  }

  .spark-remind-filter {
    min-height: 30px;
  }

  .spark-card {
    padding: 15px 14px 12px;
  }

  .spark-content {
    font-size: 13px;
  }
}


/* ---- sync.css ---- */
/* ============================================================
   GitHub Gist sync
   ============================================================ */

.sync-box {
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper);
}

.sync-status-line {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.sync-status-line strong {
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 600;
}

.sync-time {
  margin-left: auto;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9px;
  white-space: nowrap;
}

.sync-dot {
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 50%;
  background: var(--faint);
}

.sync-dot.is-ok {
  background: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
}

.sync-dot.is-syncing {
  background: var(--ochre);
  animation: sync-pulse 1.2s ease-in-out infinite;
}

.sync-dot.is-dirty,
.sync-dot.is-conflict {
  background: var(--ochre);
}

.sync-dot.is-error {
  background: var(--danger);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 12%, transparent);
}

.sync-dot.is-offline,
.sync-dot.is-paused {
  background: var(--faint);
}

.sync-meta {
  margin-top: 7px;
  word-break: break-all;
}

.gist-id {
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--surface-2);
  color: var(--ink-soft);
  font-family: var(--font-mono);
  font-size: 9.5px;
  overflow-wrap: anywhere;
}

.sync-copy {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  margin-left: 5px;
  border-radius: 4px;
  color: var(--faint);
  vertical-align: middle;
}

.sync-copy .icon {
  width: 13px;
  height: 13px;
}

.sync-copy:hover {
  color: var(--accent);
  background: var(--accent-soft);
}

.sync-message {
  margin-top: 8px;
  padding: 7px 9px;
  border: 1px solid color-mix(in srgb, var(--danger) 24%, var(--line));
  border-radius: 4px;
  background: color-mix(in srgb, var(--danger-soft) 45%, var(--surface));
  color: var(--danger);
  font-size: 10.5px;
  line-height: 1.55;
}

.sync-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.sync-disconnect {
  color: var(--danger);
}

.sync-disconnect:hover {
  background: var(--danger-soft);
  color: var(--danger);
}

.sync-warning {
  margin-top: 11px;
  padding-top: 10px;
  border-top: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
  color: var(--faint);
  font-size: 10px;
  line-height: 1.6;
}

.sync-inline {
  margin-top: 10px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.55;
}

.sync-inline.is-error {
  border-color: color-mix(in srgb, var(--danger) 28%, var(--line));
  background: color-mix(in srgb, var(--danger-soft) 40%, var(--surface));
  color: var(--danger);
}

.sync-conflict {
  display: grid;
  gap: 14px;
}

.sync-conflict > p {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.65;
}

.sync-conflict-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.sync-conflict-card {
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper);
}

.sync-conflict-card span {
  display: block;
  color: var(--faint);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.06em;
}

.sync-conflict-card strong {
  display: block;
  margin-top: 5px;
  color: var(--ink-soft);
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.sync-conflict-card small {
  display: block;
  margin-top: 5px;
  color: var(--faint);
  font-size: 9.5px;
  line-height: 1.4;
}

@keyframes sync-pulse {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 1; }
}

@media (max-width: 520px) {
  .sync-box {
    padding: 11px;
  }

  .sync-actions .btn {
    flex: 1 1 auto;
  }

  .sync-conflict-grid {
    grid-template-columns: 1fr;
  }
}

</style>

/* ---- js/utils.js ---- */
(function () {
  "use strict";

  const YC = (window.YC = window.YC || {});

  const WEEKDAYS_SHORT = ["一", "二", "三", "四", "五", "六", "日"];
  const WEEKDAYS_FULL = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
  const PROJECT_COLORS = ["#3F7256", "#A06A2A", "#4F6F8F", "#8B5A6B", "#5E7C68", "#A65B45"];
  const HABIT_COLORS = ["#3F7256", "#A06A2A", "#4F6F8F", "#8B5A6B", "#5E7C68", "#A65B45"];
  const SPARK_TYPES = [
    { key: "experience", label: "经验" },
    { key: "idea", label: "灵感" },
    { key: "mood", label: "心情" },
    { key: "note", label: "随记" }
  ];

  const pad = (n) => String(n).padStart(2, "0");

  function toISO(date) {
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }

  function parseISO(iso) {
    const parts = String(iso || "").slice(0, 10).split("-").map(Number);
    if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) return new Date(NaN);
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }

  function todayISO() {
    return toISO(new Date());
  }

  function addDays(iso, amount) {
    const date = parseISO(iso);
    if (Number.isNaN(date.getTime())) return iso;
    date.setDate(date.getDate() + amount);
    return toISO(date);
  }

  function diffDays(fromISO, toISOValue) {
    const a = parseISO(fromISO);
    const b = parseISO(toISOValue);
    return Math.round((b - a) / 86400000);
  }

  function weekdayIndex(iso) {
    const day = parseISO(iso).getDay();
    return (day + 6) % 7;
  }

  function startOfWeek(iso) {
    return addDays(iso, -weekdayIndex(iso));
  }

  function endOfWeek(iso) {
    return addDays(startOfWeek(iso), 6);
  }

  function weekDates(iso) {
    const start = startOfWeek(iso);
    return Array.from({ length: 7 }, (_, i) => addDays(start, i));
  }

  function monthKey(iso) {
    return String(iso).slice(0, 7);
  }

  function monthDays(year, month) {
    return new Date(year, month + 1, 0).getDate();
  }

  function monthGrid(year, month) {
    const first = `${year}-${pad(month + 1)}-01`;
    const start = startOfWeek(first);
    return Array.from({ length: 42 }, (_, i) => addDays(start, i));
  }

  function monthLabel(year, month) {
    return `${year} 年 ${month + 1} 月`;
  }

  function numericDate(iso) {
    const date = parseISO(iso);
    if (Number.isNaN(date.getTime())) return "—";
    return `${date.getFullYear()} / ${pad(date.getMonth() + 1)} / ${pad(date.getDate())}`;
  }

  function dateCN(iso) {
    const date = parseISO(iso);
    if (Number.isNaN(date.getTime())) return "—";
    return `${date.getMonth() + 1} 月 ${date.getDate()} 日`;
  }

  function dateLongCN(iso) {
    const date = parseISO(iso);
    if (Number.isNaN(date.getTime())) return "—";
    return `${date.getFullYear()} 年 ${date.getMonth() + 1} 月 ${date.getDate()} 日 · ${weekdayFull(iso)}`;
  }

  function dateDots(iso) {
    return String(iso || "").replace(/-/g, ".");
  }

  function dateCompact(iso) {
    const date = parseISO(iso);
    if (Number.isNaN(date.getTime())) return "—";
    return `${date.getMonth() + 1}.${pad(date.getDate())}`;
  }

  function weekdayFull(iso) {
    return WEEKDAYS_FULL[weekdayIndex(iso)] || "";
  }

  function weekdayShort(iso) {
    return WEEKDAYS_SHORT[weekdayIndex(iso)] || "";
  }

  function isWeekend(iso) {
    return weekdayIndex(iso) >= 5;
  }

  function relativeDay(iso, baseISO) {
    const base = baseISO || todayISO();
    const delta = diffDays(base, iso);
    if (delta === 0) return "今天";
    if (delta === 1) return "明天";
    if (delta === -1) return "昨天";
    if (delta > 1 && delta < 7) return weekdayFull(iso);
    if (delta < -1 && delta > -7) return weekdayFull(iso);
    return dateCN(iso);
  }

  function rangeLabel(start, end) {
    if (!start && !end) return "未设日期";
    if (start && !end) return `${dateDots(start)} 起`;
    if (!start && end) return `至 ${dateDots(end)}`;
    if (start === end) return dateDots(start);
    return `${dateDots(start)} – ${dateDots(end)}`;
  }

  function timeRange(start, end) {
    if (start && end) return `${start}–${end}`;
    if (start) return start;
    if (end) return `至 ${end}`;
    return "未定时间";
  }

  function timeSortValue(start) {
    if (!start || !/^\d{2}:\d{2}$/.test(start)) return "99:99";
    return start;
  }

  function minutesOf(time) {
    if (!time || !/^\d{2}:\d{2}$/.test(time)) return null;
    const [h, m] = time.split(":").map(Number);
    return h * 60 + m;
  }

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, (char) => {
      switch (char) {
        case "&": return "&amp;";
        case "<": return "&lt;";
        case ">": return "&gt;";
        case '"': return "&quot;";
        case "'": return "&#39;";
        default: return char;
      }
    });
  }

  function uid(prefix) {
    const head = prefix || "id";
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
      return `${head}-${window.crypto.randomUUID()}`;
    }
    return `${head}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function percent(done, total) {
    if (!total) return 0;
    return clamp(Math.round((done / total) * 100), 0, 100);
  }

  function safeColor(value, fallback) {
    return /^#[0-9a-f]{6}$/i.test(String(value || "")) ? value : (fallback || PROJECT_COLORS[0]);
  }

  function sortEvents(events) {
    return events.slice().sort((a, b) => {
      const dateCompare = String(a.date).localeCompare(String(b.date));
      if (dateCompare !== 0) return dateCompare;
      const timeCompare = timeSortValue(a.start).localeCompare(timeSortValue(b.start));
      if (timeCompare !== 0) return timeCompare;
      return String(a.createdAt || "").localeCompare(String(b.createdAt || ""));
    });
  }

  function groupBy(items, keyFn) {
    return items.reduce((acc, item) => {
      const key = keyFn(item);
      (acc[key] || (acc[key] = [])).push(item);
      return acc;
    }, {});
  }

  function escapeAttr(value) {
    return esc(value);
  }

  function isDateString(value) {
    return /^\d{4}-\d{2}-\d{2}$/.test(String(value || ""));
  }

  function isTimeString(value) {
    return !value || /^\d{2}:\d{2}$/.test(String(value));
  }

  function formatCount(n, unit) {
    return `${n}${unit || ""}`;
  }

  function sparkType(key) {
    return SPARK_TYPES.find((type) => type.key === key) || SPARK_TYPES[SPARK_TYPES.length - 1];
  }

  function sparkTypeLabel(key) {
    return sparkType(key).label;
  }

  YC.utils = {
    WEEKDAYS_SHORT,
    WEEKDAYS_FULL,
    PROJECT_COLORS,
    HABIT_COLORS,
    SPARK_TYPES,
    sparkType,
    sparkTypeLabel,
    pad,
    toISO,
    parseISO,
    todayISO,
    addDays,
    diffDays,
    weekdayIndex,
    startOfWeek,
    endOfWeek,
    weekDates,
    monthKey,
    monthDays,
    monthGrid,
    monthLabel,
    numericDate,
    dateCN,
    dateLongCN,
    dateDots,
    dateCompact,
    weekdayFull,
    weekdayShort,
    isWeekend,
    relativeDay,
    rangeLabel,
    timeRange,
    timeSortValue,
    minutesOf,
    esc,
    uid,
    clamp,
    percent,
    safeColor,
    sortEvents,
    groupBy,
    isDateString,
    isTimeString,
    formatCount
  };
})();


/* ---- js/state.js ---- */
(function () {
  "use strict";

  const YC = (window.YC = window.YC || {});
  const U = YC.utils;
  const STORAGE_KEY = "yancheng.state.v1";

  const STAGE_TEMPLATE = [
    { key: "idea", name: "Idea 生成" },
    { key: "experiment", name: "实验程序" },
    { key: "data", name: "数据收集" },
    { key: "analysis", name: "数据分析" },
    { key: "discussion", name: "结果讨论" },
    { key: "writing", name: "论文写作" },
    { key: "submission", name: "投稿" },
    { key: "acceptance", name: "接收" }
  ];

  const STAGE_DAYS = 21;
  const STAGE_OVERLAP = 0;

  let data = null;
  let storageOK = true;
  let loadError = "";

  function nowISO() {
    return new Date().toISOString();
  }

  function emptyState() {
    return {
      version: 2,
      updatedAt: nowISO(),
      meta: {
        createdAt: nowISO(),
        isDemo: false,
        demoDismissed: false
      },
      events: [],
      habits: [],
      projects: [],
      sparks: []
    };
  }

  function createStep(template, index, projectStart, projectId) {
    const start = U.addDays(projectStart, index * STAGE_DAYS - index * STAGE_OVERLAP);
    const end = U.addDays(start, STAGE_DAYS - 1);
    return {
      id: U.uid(`step-${projectId ? projectId.slice(-6) : "new"}`),
      key: template.key,
      name: template.name,
      start,
      end,
      subtasks: []
    };
  }

  function createProject(name, startDate, color, forcedId) {
    const id = forcedId || U.uid("project");
    const start = U.isDateString(startDate) ? startDate : U.todayISO();
    return {
      id,
      name,
      color: U.safeColor(color, U.PROJECT_COLORS[0]),
      createdAt: nowISO(),
      steps: STAGE_TEMPLATE.map((template, index) => createStep(template, index, start, id))
    };
  }

  function normalizeSubtask(raw) {
    if (!raw || typeof raw !== "object") return null;
    return {
      id: typeof raw.id === "string" && raw.id ? raw.id : U.uid("sub"),
      title: String(raw.title || "未命名子事项").slice(0, 180),
      done: Boolean(raw.done),
      date: U.isDateString(raw.date) ? raw.date : "",
      sourceEventId: raw.sourceEventId ? String(raw.sourceEventId) : null,
      createdAt: raw.createdAt ? String(raw.createdAt) : nowISO()
    };
  }

  function normalizeStep(raw, index, projectStart, projectId) {
    const fallback = STAGE_TEMPLATE[index] || STAGE_TEMPLATE[STAGE_TEMPLATE.length - 1];
    const start = U.isDateString(raw && raw.start) ? raw.start : U.addDays(projectStart, index * STAGE_DAYS);
    const end = U.isDateString(raw && raw.end) ? raw.end : U.addDays(start, STAGE_DAYS - 1);
    const subtasks = raw && Array.isArray(raw.subtasks)
      ? raw.subtasks.map(normalizeSubtask).filter(Boolean)
      : [];
    return {
      id: raw && typeof raw.id === "string" && raw.id ? raw.id : U.uid(`step-${projectId.slice(-5)}`),
      key: raw && raw.key ? String(raw.key) : fallback.key,
      name: raw && raw.name ? String(raw.name).slice(0, 60) : fallback.name,
      start,
      end,
      subtasks
    };
  }

  function normalizeProject(raw) {
    if (!raw || typeof raw !== "object") return null;
    const id = typeof raw.id === "string" && raw.id ? raw.id : U.uid("project");
    const name = String(raw.name || "未命名课题").slice(0, 80);
    const color = U.safeColor(raw.color, U.PROJECT_COLORS[0]);
    const createdAt = raw.createdAt ? String(raw.createdAt) : nowISO();
    const start = raw.steps && raw.steps[0] && U.isDateString(raw.steps[0].start)
      ? raw.steps[0].start
      : U.addDays(U.todayISO(), -7);
    let steps = raw.steps && Array.isArray(raw.steps) && raw.steps.length
      ? raw.steps.slice(0, 8).map((step, index) => normalizeStep(step, index, start, id))
      : STAGE_TEMPLATE.map((template, index) => createStep(template, index, start, id));
    while (steps.length < STAGE_TEMPLATE.length) {
      steps.push(createStep(STAGE_TEMPLATE[steps.length], steps.length, start, id));
    }
    return { id, name, color, createdAt, steps };
  }

  function normalizeHabit(raw) {
    if (!raw || typeof raw !== "object") return null;
    const history = {};
    if (raw.history && typeof raw.history === "object") {
      Object.keys(raw.history).forEach((key) => {
        if (U.isDateString(key) && raw.history[key]) history[key] = true;
      });
    }
    return {
      id: typeof raw.id === "string" && raw.id ? raw.id : U.uid("habit"),
      name: String(raw.name || "未命名习惯").slice(0, 60),
      color: U.safeColor(raw.color, U.HABIT_COLORS[0]),
      createdAt: raw.createdAt ? String(raw.createdAt) : nowISO(),
      history
    };
  }

  function normalizeEvent(raw) {
    if (!raw || typeof raw !== "object") return null;
    return {
      id: typeof raw.id === "string" && raw.id ? raw.id : U.uid("event"),
      title: String(raw.title || "未命名日程").slice(0, 180),
      date: U.isDateString(raw.date) ? raw.date : U.todayISO(),
      start: U.isTimeString(raw.start) ? String(raw.start || "") : "",
      end: U.isTimeString(raw.end) ? String(raw.end || "") : "",
      done: Boolean(raw.done),
      notes: String(raw.notes || "").slice(0, 2000),
      projectId: raw.projectId ? String(raw.projectId) : null,
      stepId: raw.stepId ? String(raw.stepId) : null,
      createdAt: raw.createdAt ? String(raw.createdAt) : nowISO(),
      updatedAt: raw.updatedAt ? String(raw.updatedAt) : nowISO()
    };
  }

  function normalizeSpark(raw) {
    if (!raw || typeof raw !== "object") return null;
    const content = String(raw.content || "").trim().slice(0, 4000);
    if (!content) return null;
    const validType = U.SPARK_TYPES.some((type) => type.key === raw.type);
    return {
      id: typeof raw.id === "string" && raw.id ? raw.id : U.uid("spark"),
      content,
      type: validType ? raw.type : "note",
      remind: Boolean(raw.remind),
      createdAt: raw.createdAt ? String(raw.createdAt) : nowISO(),
      updatedAt: raw.updatedAt ? String(raw.updatedAt) : nowISO()
    };
  }

  function normalizeState(raw) {
    if (!raw || typeof raw !== "object") throw new Error("数据格式无法识别");
    const meta = raw.meta && typeof raw.meta === "object" ? raw.meta : {};
    const events = Array.isArray(raw.events) ? raw.events.map(normalizeEvent).filter(Boolean) : [];
    const habits = Array.isArray(raw.habits) ? raw.habits.map(normalizeHabit).filter(Boolean) : [];
    const projects = Array.isArray(raw.projects) ? raw.projects.map(normalizeProject).filter(Boolean) : [];
    const sparks = Array.isArray(raw.sparks)
      ? raw.sparks.map(normalizeSpark).filter(Boolean)
      : (meta.isDemo && YC.seed && typeof YC.seed.demoSparks === "function" ? YC.seed.demoSparks() : []);

    const projectMap = new Map(projects.map((project) => [project.id, project]));
    events.forEach((event) => {
      const project = event.projectId ? projectMap.get(event.projectId) : null;
      const step = project && event.stepId ? project.steps.find((item) => item.id === event.stepId) : null;
      if (!project || !step) {
        event.projectId = null;
        event.stepId = null;
      }
    });

    return {
      version: 2,
      updatedAt: raw.updatedAt ? String(raw.updatedAt) : nowISO(),
      meta: {
        createdAt: meta.createdAt ? String(meta.createdAt) : nowISO(),
        isDemo: Boolean(meta.isDemo),
        demoDismissed: Boolean(meta.demoDismissed)
      },
      events,
      habits,
      projects,
      sparks
    };
  }

  function load() {
    let raw = null;
    try {
      raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return normalizeState(JSON.parse(raw));
    } catch (error) {
      loadError = "本地数据读取失败，已载入示例内容。请先导出旧数据或清空站点数据后重试。";
      if (raw) {
        try {
          window.localStorage.setItem(`yancheng.state.corrupt.${Date.now()}`, raw);
        } catch (backupError) {
          // Keep the original key untouched if the backup cannot be written.
        }
      }
      return null;
    }
  }

  function save() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      storageOK = true;
      return true;
    } catch (error) {
      storageOK = false;
      return false;
    }
  }

  function emit(reason) {
    document.dispatchEvent(new CustomEvent("yc:change", { detail: { reason: reason || "change" } }));
  }

  function commit(reason) {
    data.updatedAt = nowISO();
    save();
    emit(reason);
  }

  function init() {
    const loaded = load();
    if (!loaded) {
      data = YC.seed.build();
    } else {
      data = loaded;
    }
    if (!save()) {
      emit("storage-error");
    }
    return data;
  }

  function get() {
    return data;
  }

  function getState() {
    return data;
  }

  function getProject(projectId) {
    return data.projects.find((project) => project.id === projectId) || null;
  }

  function getStep(projectId, stepId) {
    const project = getProject(projectId);
    return project ? project.steps.find((step) => step.id === stepId) || null : null;
  }

  function getEvent(eventId) {
    return data.events.find((event) => event.id === eventId) || null;
  }

  function getHabit(habitId) {
    return data.habits.find((habit) => habit.id === habitId) || null;
  }

  function getSpark(sparkId) {
    return data.sparks.find((spark) => spark.id === sparkId) || null;
  }

  function findSubtaskByEvent(eventId) {
    for (const project of data.projects) {
      for (const step of project.steps) {
        for (const subtask of step.subtasks) {
          if (subtask.sourceEventId === eventId) {
            return { project, step, subtask };
          }
        }
      }
    }
    return null;
  }

  function removeSubtaskRef(ref) {
    const index = ref.step.subtasks.indexOf(ref.subtask);
    if (index >= 0) ref.step.subtasks.splice(index, 1);
  }

  function syncEventSubtask(event) {
    const existing = findSubtaskByEvent(event.id);
    const targetProject = event.projectId ? getProject(event.projectId) : null;
    const targetStep = targetProject && event.stepId
      ? targetProject.steps.find((step) => step.id === event.stepId)
      : null;

    if (!targetProject || !targetStep) {
      if (existing) {
        delete existing.subtask.sourceEventId;
      }
      event.projectId = null;
      event.stepId = null;
      return;
    }

    if (existing) {
      if (existing.step !== targetStep) removeSubtaskRef(existing);
      existing.subtask.title = event.title;
      existing.subtask.date = event.date;
      existing.subtask.done = event.done;
      if (existing.step !== targetStep) targetStep.subtasks.push(existing.subtask);
      return;
    }

    targetStep.subtasks.push({
      id: U.uid("sub"),
      title: event.title,
      done: event.done,
      date: event.date,
      sourceEventId: event.id,
      createdAt: nowISO()
    });
  }

  function upsertEvent(payload, eventId) {
    const title = String(payload.title || "").trim();
    const date = U.isDateString(payload.date) ? payload.date : "";
    if (!title || !date) throw new Error("请填写日程名称和日期");

    let event = eventId ? getEvent(eventId) : null;
    const isNew = !event;
    if (!event) {
      event = {
        id: U.uid("event"),
        createdAt: nowISO()
      };
      data.events.push(event);
    }

    event.title = title.slice(0, 180);
    event.date = date;
    event.start = U.isTimeString(payload.start) ? String(payload.start || "") : "";
    event.end = U.isTimeString(payload.end) ? String(payload.end || "") : "";
    event.done = Boolean(payload.done);
    event.notes = String(payload.notes || "").slice(0, 2000);
    event.projectId = payload.projectId || null;
    event.stepId = payload.stepId || null;
    event.updatedAt = nowISO();

    syncEventSubtask(event);
    commit(isNew ? "event-add" : "event-update");
    return event;
  }

  function toggleEvent(eventId) {
    const event = getEvent(eventId);
    if (!event) return null;
    event.done = !event.done;
    event.updatedAt = nowISO();
    syncEventSubtask(event);
    commit("event-toggle");
    return event;
  }

  function moveEvent(eventId, date) {
    const event = getEvent(eventId);
    if (!event || !U.isDateString(date)) return null;
    event.date = date;
    event.updatedAt = nowISO();
    syncEventSubtask(event);
    commit("event-move");
    return event;
  }

  function deleteEvent(eventId, options) {
    const event = getEvent(eventId);
    if (!event) return;
    const opts = options || {};
    const existing = findSubtaskByEvent(eventId);
    if (existing) {
      if (opts.keepSubtask) {
        delete existing.subtask.sourceEventId;
      } else {
        removeSubtaskRef(existing);
      }
    }
    data.events = data.events.filter((item) => item.id !== eventId);
    commit("event-delete");
  }

  function addHabit(name, color) {
    const label = String(name || "").trim();
    if (!label) throw new Error("请填写打卡内容");
    const habit = {
      id: U.uid("habit"),
      name: label.slice(0, 60),
      color: U.safeColor(color, U.HABIT_COLORS[0]),
      createdAt: nowISO(),
      history: {}
    };
    data.habits.push(habit);
    commit("habit-add");
    return habit;
  }

  function updateHabit(habitId, patch) {
    const habit = getHabit(habitId);
    if (!habit) return;
    if (typeof patch.name === "string" && patch.name.trim()) habit.name = patch.name.trim().slice(0, 60);
    if (patch.color) habit.color = U.safeColor(patch.color, habit.color);
    commit("habit-update");
  }

  function toggleHabit(habitId, date) {
    const habit = getHabit(habitId);
    if (!habit || !U.isDateString(date)) return;
    if (date > U.todayISO()) return;
    if (habit.history[date]) {
      delete habit.history[date];
    } else {
      habit.history[date] = true;
    }
    commit("habit-toggle");
  }

  function deleteHabit(habitId) {
    data.habits = data.habits.filter((habit) => habit.id !== habitId);
    commit("habit-delete");
  }

  function addSpark(content, type, remind) {
    const text = String(content || "").trim();
    if (!text) throw new Error("请写下一条闪念");
    const validType = U.SPARK_TYPES.some((item) => item.key === type);
    const spark = {
      id: U.uid("spark"),
      content: text.slice(0, 4000),
      type: validType ? type : "note",
      remind: Boolean(remind),
      createdAt: nowISO(),
      updatedAt: nowISO()
    };
    data.sparks.push(spark);
    commit("spark-add");
    return spark;
  }

  function updateSpark(sparkId, patch) {
    const spark = getSpark(sparkId);
    if (!spark) return;
    if (typeof patch.content === "string") {
      const text = patch.content.trim();
      if (!text) throw new Error("请写下一条闪念");
      spark.content = text.slice(0, 4000);
    }
    if (typeof patch.type === "string" && U.SPARK_TYPES.some((item) => item.key === patch.type)) {
      spark.type = patch.type;
    }
    if (typeof patch.remind === "boolean") spark.remind = patch.remind;
    spark.updatedAt = nowISO();
    commit("spark-update");
    return spark;
  }

  function toggleSparkRemind(sparkId) {
    const spark = getSpark(sparkId);
    if (!spark) return null;
    spark.remind = !spark.remind;
    spark.updatedAt = nowISO();
    commit("spark-remind");
    return spark;
  }

  function deleteSpark(sparkId) {
    data.sparks = data.sparks.filter((spark) => spark.id !== sparkId);
    commit("spark-delete");
  }

  function createNewProject(name, startDate, color) {
    const label = String(name || "").trim();
    if (!label) throw new Error("请填写课题名称");
    const project = createProject(label.slice(0, 80), startDate, color);
    data.projects.push(project);
    commit("project-add");
    return project;
  }

  function updateProject(projectId, patch) {
    const project = getProject(projectId);
    if (!project) return;
    if (typeof patch.name === "string" && patch.name.trim()) project.name = patch.name.trim().slice(0, 80);
    if (patch.color) project.color = U.safeColor(patch.color, project.color);
    if (U.isDateString(patch.start)) {
      const oldStart = project.steps[0] ? project.steps[0].start : patch.start;
      const delta = U.diffDays(oldStart, patch.start);
      if (delta !== 0) {
        project.steps.forEach((step) => {
          if (U.isDateString(step.start)) step.start = U.addDays(step.start, delta);
          if (U.isDateString(step.end)) step.end = U.addDays(step.end, delta);
        });
      }
    }
    commit("project-update");
  }

  function deleteProject(projectId) {
    const project = getProject(projectId);
    if (!project) return;
    const stepIds = new Set(project.steps.map((step) => step.id));
    data.events.forEach((event) => {
      if (event.projectId === projectId || (event.stepId && stepIds.has(event.stepId))) {
        event.projectId = null;
        event.stepId = null;
        event.updatedAt = nowISO();
      }
    });
    data.projects = data.projects.filter((item) => item.id !== projectId);
    commit("project-delete");
  }

  function updateStepDates(projectId, stepId, start, end) {
    const step = getStep(projectId, stepId);
    if (!step) return;
    if (U.isDateString(start)) step.start = start;
    if (U.isDateString(end)) step.end = end;
    if (step.start && step.end && step.end < step.start) {
      step.end = step.start;
    }
    commit("step-dates");
  }

  function addSubtask(projectId, stepId, title, date) {
    const step = getStep(projectId, stepId);
    if (!step) return;
    const label = String(title || "").trim();
    if (!label) throw new Error("请填写子事项");
    step.subtasks.push({
      id: U.uid("sub"),
      title: label.slice(0, 180),
      done: false,
      date: U.isDateString(date) ? date : "",
      sourceEventId: null,
      createdAt: nowISO()
    });
    commit("subtask-add");
  }

  function toggleSubtask(projectId, stepId, subtaskId) {
    const step = getStep(projectId, stepId);
    if (!step) return;
    const subtask = step.subtasks.find((item) => item.id === subtaskId);
    if (!subtask) return;
    subtask.done = !subtask.done;
    if (subtask.sourceEventId) {
      const event = getEvent(subtask.sourceEventId);
      if (event) {
        event.done = subtask.done;
        event.updatedAt = nowISO();
      }
    }
    commit("subtask-toggle");
  }

  function deleteSubtask(projectId, stepId, subtaskId) {
    const step = getStep(projectId, stepId);
    if (!step) return;
    const subtask = step.subtasks.find((item) => item.id === subtaskId);
    if (!subtask) return;
    if (subtask.sourceEventId) {
      const event = getEvent(subtask.sourceEventId);
      if (event) {
        event.projectId = null;
        event.stepId = null;
        event.updatedAt = nowISO();
      }
    }
    step.subtasks = step.subtasks.filter((item) => item.id !== subtaskId);
    commit("subtask-delete");
  }

  function completeEmptyStage(projectId, stepId) {
    const step = getStep(projectId, stepId);
    if (!step || step.subtasks.length) return;
    step.subtasks.push({
      id: U.uid("sub"),
      title: `完成「${step.name}」阶段`,
      done: true,
      date: U.todayISO(),
      sourceEventId: null,
      createdAt: nowISO()
    });
    commit("stage-complete-empty");
  }

  function exportObject() {
    return {
      app: "研程",
      schema: 2,
      exportedAt: nowISO(),
      counts: {
        events: data.events.length,
        habits: data.habits.length,
        projects: data.projects.length,
        sparks: data.sparks.length
      },
      data
    };
  }

  function exportJSON() {
    return JSON.stringify(exportObject(), null, 2);
  }

  function importJSON(text) {
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (error) {
      throw new Error("JSON 解析失败，请检查文件内容");
    }
    const raw = parsed && parsed.data ? parsed.data : parsed;
    if (!raw || typeof raw !== "object" || (!Array.isArray(raw.events) && !Array.isArray(raw.habits) && !Array.isArray(raw.projects) && !Array.isArray(raw.sparks))) {
      throw new Error("文件中没有可识别的研程数据");
    }
    const next = normalizeState(raw);
    data = next;
    save();
    emit("import");
    return next;
  }

  function resetEmpty() {
    data = emptyState();
    save();
    emit("reset");
  }

  function loadDemo() {
    data = YC.seed.build();
    save();
    emit("demo");
  }

  function dismissDemo() {
    if (!data.meta) data.meta = {};
    data.meta.demoDismissed = true;
    commit("demo-dismiss");
  }

  YC.store = {
    STAGE_TEMPLATE,
    init,
    getState,
    get,
    getProject,
    getStep,
    getEvent,
    getHabit,
    getSpark,
    findSubtaskByEvent,
    upsertEvent,
    toggleEvent,
    moveEvent,
    deleteEvent,
    addHabit,
    updateHabit,
    toggleHabit,
    deleteHabit,
    addSpark,
    updateSpark,
    toggleSparkRemind,
    deleteSpark,
    createProject: createNewProject,
    createProjectRecord: createProject,
    updateProject,
    deleteProject,
    updateStepDates,
    addSubtask,
    toggleSubtask,
    deleteSubtask,
    completeEmptyStage,
    exportJSON,
    exportObject,
    importJSON,
    resetEmpty,
    loadDemo,
    dismissDemo,
    get storageOK() { return storageOK; },
    get loadError() { return loadError; }
  };
})();
