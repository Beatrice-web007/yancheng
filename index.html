/* ---- js/stats.js ---- */
(function () {
  "use strict";

  const YC = (window.YC = window.YC || {});
  const U = YC.utils;

  function data() {
    return YC.store.getState();
  }

  function stepStats(step) {
    const total = step.subtasks.length;
    const done = step.subtasks.filter((subtask) => subtask.done).length;
    return {
      total,
      done,
      remaining: total - done,
      pct: U.percent(done, total),
      complete: total > 0 && done === total
    };
  }

  function projectStats(project) {
    const today = U.todayISO();
    const steps = project.steps.map((step, index) => {
      const stats = stepStats(step);
      const overdue = !stats.complete && Boolean(step.end) && step.end < today;
      return {
        index,
        step,
        stats,
        overdue,
        complete: stats.complete
      };
    });
    const nextIndex = steps.findIndex((item) => !item.complete);
    steps.forEach((item) => {
      item.active = item.index === nextIndex;
    });
    const pct = Math.round(steps.reduce((sum, item) => sum + item.stats.pct, 0) / (steps.length || 1));
    return {
      pct: U.clamp(pct, 0, 100),
      steps,
      next: nextIndex >= 0 ? steps[nextIndex] : null,
      nextIndex,
      completedStages: steps.filter((item) => item.complete).length,
      plannedStages: steps.filter((item) => item.stats.total > 0).length,
      emptyStages: steps.filter((item) => item.stats.total === 0).length,
      totalTasks: steps.reduce((sum, item) => sum + item.stats.total, 0),
      doneTasks: steps.reduce((sum, item) => sum + item.stats.done, 0),
      allComplete: steps.every((item) => item.complete)
    };
  }

  function overallProjectStats() {
    const state = data();
    if (!state.projects.length) {
      return { pct: 0, active: 0, completed: 0, total: 0, items: [] };
    }
    const stats = state.projects.map((project) => ({ project, stats: projectStats(project) }));
    const pct = Math.round(stats.reduce((sum, item) => sum + item.stats.pct, 0) / stats.length);
    return {
      pct,
      active: stats.filter((item) => item.stats.pct < 100).length,
      completed: stats.filter((item) => item.stats.allComplete).length,
      total: state.projects.length,
      items: stats
    };
  }

  function eventsForDate(date) {
    return U.sortEvents(data().events.filter((event) => event.date === date));
  }

  function eventsInRange(start, end) {
    return U.sortEvents(data().events.filter((event) => event.date >= start && event.date <= end));
  }

  function weekEventStats(baseISO) {
    const dates = U.weekDates(baseISO || U.todayISO());
    return {
      dates,
      items: dates.map((date) => {
        const events = eventsForDate(date);
        return {
          date,
          total: events.length,
          done: events.filter((event) => event.done).length,
          events
        };
      })
    };
  }

  function habitCurrentStreak(habit, baseISO) {
    const base = baseISO || U.todayISO();
    let cursor = habit.history[base] ? base : U.addDays(base, -1);
    let streak = 0;
    while (habit.history[cursor] && streak < 3660) {
      streak += 1;
      cursor = U.addDays(cursor, -1);
    }
    return streak;
  }

  function habitBestStreak(habit) {
    const dates = Object.keys(habit.history).filter((date) => habit.history[date]).sort();
    let best = 0;
    let current = 0;
    let previous = "";
    dates.forEach((date) => {
      if (previous && U.diffDays(previous, date) === 1) {
        current += 1;
      } else {
        current = 1;
      }
      best = Math.max(best, current);
      previous = date;
    });
    return best;
  }

  function habitMonthCount(habit, year, month) {
    const total = U.monthDays(year, month);
    let count = 0;
    for (let day = 1; day <= total; day += 1) {
      const iso = `${year}-${U.pad(month + 1)}-${U.pad(day)}`;
      if (habit.history[iso]) count += 1;
    }
    return count;
  }

  function habitOverview() {
    const state = data();
    const today = U.todayISO();
    const doneToday = state.habits.filter((habit) => habit.history[today]).length;
    const totalCheckins = state.habits.reduce((sum, habit) => sum + Object.keys(habit.history).length, 0);
    const best = state.habits.reduce((max, habit) => Math.max(max, habitBestStreak(habit)), 0);
    const current = state.habits.reduce((max, habit) => Math.max(max, habitCurrentStreak(habit)), 0);
    return {
      doneToday,
      totalHabits: state.habits.length,
      totalCheckins,
      bestStreak: best,
      currentStreak: current
    };
  }

  function hashString(value) {
    let hash = 2166136261;
    const text = String(value || "");
    for (let index = 0; index < text.length; index += 1) {
      hash ^= text.charCodeAt(index);
      hash = Math.imul(hash, 16777619);
    }
    return hash >>> 0;
  }

  function dailySpark(dateISO) {
    const state = data();
    const date = U.isDateString(dateISO) ? dateISO : U.todayISO();
    const pool = state.sparks
      .filter((spark) => spark.remind && String(spark.content || "").trim())
      .slice()
      .sort((a, b) => String(a.id).localeCompare(String(b.id)));
    if (!pool.length) return { spark: null, total: 0, date };
    const index = hashString(date) % pool.length;
    return { spark: pool[index], total: pool.length, date };
  }

  function sparkOverview() {
    const state = data();
    const today = U.todayISO();
    const weekStart = U.addDays(today, -6);
    return {
      total: state.sparks.length,
      reminders: state.sparks.filter((spark) => spark.remind).length,
      weekAdded: state.sparks.filter((spark) => {
        const created = new Date(spark.createdAt);
        if (Number.isNaN(created.getTime())) return false;
        const date = U.toISO(created);
        return date >= weekStart && date <= today;
      }).length
    };
  }

  function eventProject(event) {
    if (!event.projectId) return null;
    const project = YC.store.getProject(event.projectId);
    if (!project) return null;
    const step = project.steps.find((item) => item.id === event.stepId);
    if (!step) return null;
    return { project, step, index: project.steps.indexOf(step) };
  }

  Object.assign(YC.store, {
    stepStats,
    projectStats,
    overallProjectStats,
    eventsForDate,
    eventsInRange,
    weekEventStats,
    habitCurrentStreak,
    habitBestStreak,
    habitMonthCount,
    habitOverview,
    dailySpark,
    sparkOverview,
    eventProject
  });
})();


/* ---- js/ui.js ---- */
(function () {
  "use strict";

  const YC = (window.YC = window.YC || {});
  const U = YC.utils;

  function icon(name, className) {
    return `<svg class="icon${className ? ` ${className}` : ""}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
  }

  const modalRoot = () => document.getElementById("modal-root");
  const stack = [];
  let lastFocused = null;

  function modalHTML(config) {
    const head = `
      <div class="modal-head">
        <div>
          ${config.kicker ? `<div class="modal-kicker">${config.kicker}</div>` : ""}
          <h2 class="modal-title" id="modal-title">${config.title || ""}</h2>
          ${config.sub ? `<p class="modal-sub">${config.sub}</p>` : ""}
        </div>
        <button class="icon-btn modal-close" type="button" data-action="close-modal" aria-label="关闭">
          ${icon("x")}
        </button>
      </div>`;
    const footer = config.footer
      ? `<div class="modal-foot">${config.footer}</div>`
      : "";
    return `
      <div class="modal-layer" data-modal-layer>
        <div class="modal-backdrop" ${config.dismissible === false ? "" : 'data-action="close-modal"'} aria-hidden="true"></div>
        <section class="modal${config.wide ? " modal--wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          ${head}
          <div class="modal-body">${config.body || ""}</div>
          ${footer}
        </section>
      </div>`;
  }

  function focusFirst() {
    const root = modalRoot();
    if (!root) return;
    const target = root.querySelector("[data-autofocus]") ||
      root.querySelector(".modal-body input:not([type=hidden]), .modal-body select, .modal-body textarea") ||
      root.querySelector(".modal-foot .btn--primary, .modal-foot .btn--danger") ||
      root.querySelector(".modal-close");
    if (target) {
      window.requestAnimationFrame(() => {
        try { target.focus({ preventScroll: true }); } catch (error) { target.focus(); }
      });
    }
  }

  function render(shouldFocus) {
    const root = modalRoot();
    if (!root) return;
    const current = stack[stack.length - 1];
    if (!current) {
      root.innerHTML = "";
      document.body.classList.remove("modal-open");
      if (lastFocused && typeof lastFocused.focus === "function") {
        try { lastFocused.focus({ preventScroll: true }); } catch (error) { lastFocused.focus(); }
      }
      lastFocused = null;
      return;
    }
    const previousBody = root.querySelector(".modal-body");
    const scrollTop = previousBody ? previousBody.scrollTop : 0;
    root.innerHTML = modalHTML(current);
    document.body.classList.add("modal-open");
    const nextBody = root.querySelector(".modal-body");
    if (nextBody && scrollTop) nextBody.scrollTop = scrollTop;
    if (shouldFocus !== false) focusFirst();
  }

  function openModal(config) {
    if (!stack.length) lastFocused = document.activeElement;
    stack.push(config);
    render();
  }

  function closeTop() {
    if (!stack.length) return;
    stack.pop();
    render();
  }

  function closeAll() {
    stack.length = 0;
    render();
  }

  function refreshModal() {
    if (!stack.length) return;
    render();
  }

  function currentModal() {
    return stack[stack.length - 1] || null;
  }

  function confirmAction() {
    const current = currentModal();
    if (!current || typeof current.onConfirm !== "function") return;
    const action = current.onConfirm;
    closeTop();
    action();
  }

  function confirm(options) {
    const opts = options || {};
    const danger = opts.danger !== false;
    openModal({
      kicker: opts.kicker || "请确认",
      title: U.esc(opts.title || "确认操作"),
      body: `
        <div class="confirm-copy">
          <span class="confirm-icon">${icon(danger ? "alert" : "spark")}</span>
          <p>${U.esc(opts.message || "")}</p>
        </div>`,
      footer: `
        <button class="btn btn--ghost" type="button" data-action="close-modal">取消</button>
        <button class="btn ${danger ? "btn--danger" : "btn--primary"}" type="button" data-action="modal-confirm">
          ${U.esc(opts.confirmLabel || "确认")}
        </button>`,
      onConfirm: opts.onConfirm,
      dismissible: true
    });
  }

  function toast(message, options) {
    const opts = options || {};
    const root = document.getElementById("toast-root");
    if (!root) return;
    const el = document.createElement("div");
    el.className = "toast";
    const type = opts.type || "success";
    const iconName = type === "error" ? "alert" : type === "info" ? "spark" : "check";
    el.innerHTML = `${icon(iconName)}<span></span>`;
    el.querySelector("span").textContent = message;
    root.appendChild(el);
    const timeout = Number(opts.duration) || 2600;
    window.setTimeout(() => {
      el.classList.add("is-leaving");
      window.setTimeout(() => el.remove(), 220);
    }, timeout);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text)
        .then(() => true)
        .catch(() => fallbackCopy(text));
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text) {
    try {
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.left = "-9999px";
      area.style.top = "0";
      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, area.value.length);
      const ok = document.execCommand("copy");
      area.remove();
      return ok;
    } catch (error) {
      return false;
    }
  }

  function downloadText(filename, text, mime) {
    try {
      const blob = new Blob([text], { type: mime || "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      anchor.style.display = "none";
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      return true;
    } catch (error) {
      return false;
    }
  }

  document.addEventListener("keydown", (event) => {
    if (!stack.length) return;
    const current = currentModal();
    if (event.key === "Escape") {
      if (current && current.dismissible === false) return;
      event.preventDefault();
      closeTop();
      return;
    }
    if (event.key !== "Tab") return;
    const root = modalRoot();
    const layer = root && root.querySelector(".modal");
    if (!layer) return;
    const focusable = Array.from(layer.querySelectorAll(
      'button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'
    )).filter((el) => el.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });

  YC.ui = {
    icon,
    openModal,
    closeTop,
    closeAll,
    refreshModal,
    currentModal,
    confirm,
    confirmAction,
    toast,
    copyText,
    downloadText
  };
})();


/* ---- js/components.js ---- */
(function () {
  "use strict";

  const YC = (window.YC = window.YC || {});
  const U = YC.utils;
  const S = YC.store;
  const icon = YC.ui.icon;

  function eventLink(event) {
    return S.eventProject(event);
  }

  function eventColor(event) {
    const link = eventLink(event);
    return link ? link.project.color : "var(--accent)";
  }

  function linkLabel(link) {
    if (!link) return "";
    return `${link.project.name} · ${U.pad(link.index + 1)} ${link.step.name}`;
  }

  function eventRow(event, options) {
    const opts = options || {};
    const link = eventLink(event);
    const color = eventColor(event);
    const meta = [];
    if (opts.showDate) meta.push(`<span>${U.dateCN(event.date)}</span>`);
    if (link) {
      meta.push(`<span class="link-badge" style="--project:${U.esc(link.project.color)}"><span>${U.esc(linkLabel(link))}</span></span>`);
    }
    if (event.notes) meta.push(`<span>有备注</span>`);
    const drag = opts.draggable ? ' draggable="true"' : "";
    return `
      <div class="event-row${event.done ? " is-done" : ""}${opts.className ? ` ${opts.className}` : ""}"
           style="--event-color:${U.esc(color)}" data-event-id="${U.esc(event.id)}"${drag}>
        <button class="check${event.done ? " is-done" : ""}" type="button"
                data-action="toggle-event" data-id="${U.esc(event.id)}"
                aria-label="${event.done ? "标记为未完成" : "标记为完成"}：${U.esc(event.title)}"
                aria-pressed="${event.done ? "true" : "false"}">
          ${icon("check")}
        </button>
        <span class="event-time">${U.esc(U.timeRange(event.start, event.end))}</span>
        <div class="event-main">
          <button class="event-title" type="button" data-action="open-event" data-id="${U.esc(event.id)}">${U.esc(event.title)}</button>
          ${meta.length ? `<div class="event-meta">${meta.join("")}</div>` : ""}
        </div>
        <button class="icon-btn icon-btn--small event-edit" type="button" data-action="open-event"
                data-id="${U.esc(event.id)}" aria-label="编辑日程：${U.esc(event.title)}">
          ${icon("edit")}
        </button>
      </div>`;
  }

  function eventPill(event) {
    const color = eventColor(event);
    return `
      <button class="event-pill${event.done ? " is-done" : ""}" type="button"
              style="--project:${U.esc(color)}" data-action="open-event" data-id="${U.esc(event.id)}"
              data-event-id="${U.esc(event.id)}" draggable="true" title="${U.esc(event.title)}">
        <span>${U.esc(event.title)}</span>
      </button>`;
  }

  function eventDot(event) {
    return `<i style="--project:${U.esc(eventColor(event))}"></i>`;
  }

  function weekEvent(event) {
    const link = eventLink(event);
    const color = eventColor(event);
    return `
      <button class="week-event${event.done ? " is-done" : ""}" type="button"
              style="--project:${U.esc(color)}" data-action="open-event" data-id="${U.esc(event.id)}"
              data-event-id="${U.esc(event.id)}" draggable="true" title="${U.esc(event.title)}">
        <strong>${U.esc(event.title)}</strong>
        <small>${U.esc(event.start || "全天")}${link ? ` · ${U.esc(link.step.name)}` : ""}</small>
      </button>`;
  }

  function projectOptions(selectedProjectId, selectedStepId) {
    const groups = S.getState().projects.map((project) => {
      const options = project.steps.map((step, index) => {
        const selected = selectedProjectId === project.id && selectedStepId === step.id;
        return `<option value="${U.esc(project.id)}::${U.esc(step.id)}" ${selected ? "selected" : ""}>${U.pad(index + 1)} ${U.esc(step.name)}</option>`;
      }).join("");
      return `<optgroup label="${U.esc(project.name)}">${options}</optgroup>`;
    }).join("");
    return `<option value="">不关联课题</option>${groups}`;
  }

  function splitLinkValue(value) {
    const text = String(value || "");
    const index = text.indexOf("::");
    if (index < 0) return { projectId: null, stepId: null };
    return {
      projectId: text.slice(0, index) || null,
      stepId: text.slice(index + 2) || null
    };
  }

  function stageClasses(item) {
    const classes = ["stage"];
    if (item.complete) classes.push("is-done");
    if (item.active) classes.push("is-active");
    if (item.overdue) classes.push("is-overdue");
    return classes.join(" ");
  }

  function stageCountText(item) {
    if (!item.stats.total) return "待规划";
    return `${item.stats.done}/${item.stats.total}`;
  }

  function nextActionText(next) {
    if (!next) return "全部阶段已完成。";
    if (!next.stats.total) return `为「${next.step.name}」添加子事项，或直接标记阶段完成。`;
    const remaining = next.stats.remaining;
    return `推进「${next.step.name}」，还剩 ${remaining} 项子事项。`;
  }

  function emptyState(opts) {
    return `
      <div class="empty">
        <span class="empty-mark">${icon(opts.icon || "spark")}</span>
        <strong>${U.esc(opts.title || "这里还没有内容")}</strong>
        <p>${U.esc(opts.text || "添加第一项，开始记录。")}</p>
        ${opts.action || ""}
      </div>`;
  }

  function progressBar(value, color, options) {
    const opts = options || {};
    const pct = U.clamp(Math.round(value || 0), 0, 100);
    return `
      <div class="progress${opts.thin ? " progress--thin" : ""}${opts.thick ? " progress--thick" : ""}">
        <span style="width:${pct}%;${color ? `--progress-color:${U.esc(color)};` : ""}"></span>
      </div>`;
  }

  function stageLinkText(link) {
    return link ? `${U.pad(link.index + 1)} ${link.step.name}` : "";
  }

  YC.components = {
    eventRow,
    eventPill,
    eventDot,
    weekEvent,
    projectOptions,
    splitLinkValue,
    stageClasses,
    stageCountText,
    nextActionText,
    emptyState,
    progressBar,
    eventLink,
    eventColor,
    linkLabel,
    stageLinkText
  };
})();

              <h2 class="panel-title" id="today-week-title">${icon("target")}本周节奏</h2>
              <span class="section-kicker">${weekDone}/${weekTotal}</span>
            </div>
            <div class="week-bars" role="img" aria-label="本周每天的日程完成比例">${weekBars}</div>
            <p class="habit-hint">柱高表示当天日程完成比例。今天用金色标出。</p>
          </section>
        </aside>
      </div>`;
  }

  YC.views = YC.views || {};
  YC.views.today = { render };
})();


/* ---- js/views/schedule.js ---- */
(function () {
  "use strict";

  const YC = (window.YC = window.YC || {});
  const U = YC.utils;
  const S = YC.store;
  const C = YC.components;
  const icon = YC.ui.icon;

  function uiState() {
    return YC.app.ui;
  }

  function shiftMonth(iso, delta) {
    const date = U.parseISO(iso);
    const day = date.getDate();
    date.setDate(1);
    date.setMonth(date.getMonth() + delta);
    const max = U.monthDays(date.getFullYear(), date.getMonth());
    date.setDate(Math.min(day, max));
    return U.toISO(date);
  }

  function isoWeekNumber(iso) {
    const date = U.parseISO(iso);
    const target = new Date(date.getTime());
    const dayNr = (date.getDay() + 6) % 7;
    target.setDate(target.getDate() - dayNr + 3);
    const firstThursday = new Date(target.getFullYear(), 0, 4);
    const firstDayNr = (firstThursday.getDay() + 6) % 7;
    firstThursday.setDate(firstThursday.getDate() - firstDayNr + 3);
    return 1 + Math.round((target - firstThursday) / (7 * 86400000));
  }

  function eventsByDate(events) {
    return events.reduce((map, event) => {
      (map[event.date] || (map[event.date] = [])).push(event);
      return map;
    }, {});
  }

  function toolbar() {
    const ui = uiState();
    const today = U.todayISO();
    const selected = ui.selectedDate || today;
    let title = "";
    let sub = "";
    if (ui.scheduleView === "month") {
      const date = U.parseISO(selected);
      title = U.monthLabel(date.getFullYear(), date.getMonth());
      sub = `${date.getFullYear()} 年 · ${U.monthDays(date.getFullYear(), date.getMonth())} 天`;
    } else if (ui.scheduleView === "week") {
      const start = U.startOfWeek(selected);
      const end = U.endOfWeek(selected);
      title = `${U.dateCompact(start)} – ${U.dateCompact(end)}`;
      sub = `${U.parseISO(selected).getFullYear()} 年 · 第 ${isoWeekNumber(selected)} 周`;
    } else {
      title = U.dateLongCN(selected).split(" · ")[0];
      sub = `${U.numericDate(selected).slice(0, 4)} · ${U.weekdayFull(selected)}${selected === today ? " · 今天" : ""}`;
    }
    const viewButton = (value, label, iconName) => `
      <button type="button" data-action="set-schedule-view" data-view="${value}"
              class="${ui.scheduleView === value ? "is-active" : ""}" aria-pressed="${ui.scheduleView === value ? "true" : "false"}">
        ${icon(iconName)}${label}
      </button>`;
    return `
      <div class="schedule-toolbar">
        <div class="date-nav">
          <button class="icon-btn" type="button" data-action="calendar-prev" aria-label="上一${ui.scheduleView === "day" ? "天" : ui.scheduleView === "week" ? "周" : "月"}">${icon("left")}</button>
          <div class="date-nav-copy"><strong>${U.esc(title)}</strong><span>${U.esc(sub)}</span></div>
          <button class="icon-btn" type="button" data-action="calendar-next" aria-label="下一${ui.scheduleView === "day" ? "天" : ui.scheduleView === "week" ? "周" : "月"}">${icon("right")}</button>
          <button class="btn btn--secondary btn--small" type="button" data-action="calendar-today">今天</button>
        </div>
        <div class="segmented" role="group" aria-label="日历视图">
          ${viewButton("month", "月", "grid")}
          ${viewButton("week", "周", "columns")}
          ${viewButton("day", "日", "list")}
        </div>
      </div>`;
  }

  function monthView() {
    const ui = uiState();
    const today = U.todayISO();
    const selected = ui.selectedDate || today;
    const date = U.parseISO(selected);
    const year = date.getFullYear();
    const month = date.getMonth();
    const grid = U.monthGrid(year, month);
    const map = eventsByDate(S.getState().events);
    const currentKey = U.monthKey(selected);

    const weekdays = U.WEEKDAYS_SHORT.map((label) => {
      const weekend = label === "六" || label === "日";
      return `<span class="${weekend ? "is-weekend" : ""}">周${label}</span>`;
    }).join("");

    const cells = grid.map((iso) => {
      const events = U.sortEvents(map[iso] || []);
      const other = U.monthKey(iso) !== currentKey;
      const isToday = iso === today;
      const shown = events.slice(0, 3);
      const more = events.length - shown.length;
      const dots = events.slice(0, 4).map((event) => C.eventDot(event)).join("");
      const label = `${U.dateLongCN(iso)}，${events.length} 项日程`;
      return `
        <div class="month-cell${other ? " is-other" : ""}${isToday ? " is-today" : ""}"
             data-action="open-day" data-date="${iso}" data-drop-date="${iso}"
             role="button" tabindex="0" aria-label="${U.esc(label)}">
          <div class="month-dayline">
            <span class="month-daynum">${U.parseISO(iso).getDate()}</span>
            <button class="month-add" type="button" data-action="add-event" data-date="${iso}" aria-label="${U.esc(U.dateCN(iso))}新建日程">${icon("plus")}</button>
          </div>
          <div class="month-events">
            ${shown.map((event) => C.eventPill(event)).join("")}
            ${more > 0 ? `<span class="month-more">+${more}</span>` : ""}
          </div>
          <div class="month-dots" aria-hidden="true">${dots}</div>
        </div>`;
    }).join("");

    return `
      <div class="schedule-wrap">
        <div class="weekday-row">${weekdays}</div>
        <div class="month-grid">${cells}</div>
      </div>`;
  }

  function weekView() {
    const ui = uiState();
    const today = U.todayISO();
    const selected = ui.selectedDate || today;
    const dates = U.weekDates(selected);
    const map = eventsByDate(S.getState().events);
    const cols = dates.map((iso) => {
      const events = U.sortEvents(map[iso] || []);
      const isToday = iso === today;
      return `
        <section class="week-col${isToday ? " is-today" : ""}" data-drop-date="${iso}" aria-label="${U.esc(U.dateLongCN(iso))}">
          <div class="week-col-head">
            <button type="button" data-action="open-day" data-date="${iso}">
              ${U.weekdayFull(iso)}<strong>${U.parseISO(iso).getDate()}</strong>
            </button>
            <span>${U.parseISO(iso).getMonth() + 1} 月</span>
          </div>
          <div class="week-col-events">
            ${events.length ? events.map((event) => C.weekEvent(event)).join("") : `<div class="week-empty">无安排</div>`}
          </div>
          <button class="week-add" type="button" data-action="add-event" data-date="${iso}">
            ${icon("plus")}添加
          </button>
        </section>`;
    }).join("");
    return `<div class="week-grid">${cols}</div>`;
  }

  function dayView() {
    const ui = uiState();
    const selected = ui.selectedDate || U.todayISO();
    const events = S.eventsForDate(selected);
    const done = events.filter((event) => event.done).length;
    if (!events.length) {
      return `
        <div class="day-layout">
          <div class="day-agenda">
            <div class="schedule-empty">
              ${C.emptyState({
                icon: "calendar",
                title: "这一天还没有安排",
                text: "添加一项日程，或回到周视图看看整周的节奏。",
                action: `<button class="btn btn--primary btn--small" type="button" data-action="add-event" data-date="${selected}">${icon("plus")}新建日程</button>`
              })}
            </div>
          </div>
          <aside class="day-side">
            <div class="panel">
              <div class="panel-head"><h2 class="panel-title">${icon("target")}当日概览</h2></div>
              <p class="settings-copy">还没有日程。先放进一件最值得推进的小事。</p>
            </div>
          </aside>
        </div>`;
    }
    const allDay = events.filter((event) => !event.start);
    const timed = events.filter((event) => event.start);
    const renderGroup = (label, items) => items.length
      ? `<div class="day-group">
           <div class="day-group-label">${label}</div>
           <div class="timeline-list day-timeline">${items.map((event) => C.eventRow(event, { className: "timeline-event" })).join("")}</div>
         </div>`
      : "";
    const linked = events.map((event) => C.eventLink(event)).filter(Boolean);
    const grouped = linked.reduce((map, link) => {
      const key = link.project.id;
      if (!map[key]) map[key] = { project: link.project, stages: new Set(), count: 0 };
      map[key].stages.add(link.step.name);
      map[key].count += 1;
      return map;
    }, {});
    const linkedRows = Object.values(grouped).map((item) => `
      <div class="day-link-row" style="--project:${U.esc(item.project.color)}">
        <span class="day-link-dot" aria-hidden="true"></span>
        <div>
          <strong>${U.esc(item.project.name)}</strong>
          <span>${U.esc(Array.from(item.stages).join(" / "))} · ${item.count} 项</span>
        </div>
      </div>`).join("");
    return `
      <div class="day-layout">
        <div class="day-agenda">
          <div class="day-date-line">${events.length} 项日程 · ${done} 项已完成</div>
          ${renderGroup("未定时间", allDay)}
          ${renderGroup("时间轴", timed)}
        </div>
        <aside class="day-side">
          <div class="panel">
            <div class="panel-head"><h2 class="panel-title">${icon("target")}当日概览</h2><span class="section-kicker">${done}/${events.length}</span></div>
            <div class="day-side-stats">
              <div><strong>${events.length}</strong><span>全部</span></div>
              <div><strong>${done}</strong><span>完成</span></div>
              <div><strong>${events.length - done}</strong><span>待办</span></div>
            </div>
            <div class="divider"></div>
            <div class="section-kicker">关联课题</div>
            <div class="day-links">
              ${linkedRows || `<p class="settings-copy" style="margin-top:8px">今天的日程还没有关联课题。编辑日程时可以选择课题阶段。</p>`}
            </div>
          </div>
        </aside>
      </div>`;
  }

  function render() {
    const ui = uiState();
    const today = U.todayISO();
    const selected = ui.selectedDate || today;
    const selectedLabel = U.relativeDay(selected, today);
    const body = ui.scheduleView === "month" ? monthView() : ui.scheduleView === "week" ? weekView() : dayView();
    return `
      <header class="view-head">
        <div class="view-head-copy">
          <div class="eyebrow">CALENDAR · ${U.numericDate(today)}</div>
          <h1 class="view-title">日程</h1>
          <p class="view-sub">月视图看全貌，周视图排节奏，日视图专注当天。点圆圈标记完成；日程可随时修改或移动。</p>
        </div>
        <div class="view-actions">
          <button class="btn btn--primary" type="button" data-action="add-event" data-date="${selected}">
            ${icon("plus")}新建日程
          </button>
        </div>
      </header>
      ${toolbar()}
      ${body}
      ${ui.scheduleView === "day" ? "" : `<p class="habit-hint" style="margin-top:14px">当前选中：${U.esc(selectedLabel)} · ${U.esc(U.dateCN(selected))}</p>`}`;
  }

  YC.views = YC.views || {};
  YC.views.schedule = {
    render,
    shiftMonth,
    isoWeekNumber
  };
})();


/* ---- js/views/habits.js ---- */
(function () {
  "use strict";

  const YC = (window.YC = window.YC || {});
  const U = YC.utils;
  const S = YC.store;
  const C = YC.components;
  const icon = YC.ui.icon;

  function monthFromUI() {
    const ui = YC.app.ui;
    const today = U.todayISO();
    const key = ui.habitMonth || U.monthKey(today);
    const [year, month] = key.split("-").map(Number);
    if (!year || !month) {
      const date = U.parseISO(today);
      return { year: date.getFullYear(), month: date.getMonth() };
    }
    return { year, month: month - 1 };
  }

  function shiftMonth(year, month, delta) {
    const date = new Date(year, month + delta, 1);
    return { year: date.getFullYear(), month: date.getMonth() };
  }

  function heatmap(habit, year, month) {
    const today = U.todayISO();
    const firstISO = `${year}-${U.pad(month + 1)}-01`;
    const leading = U.weekdayIndex(firstISO);
    const total = U.monthDays(year, month);
    const cells = [];
    for (let i = 0; i < leading; i += 1) {
      cells.push(`<span class="habit-cell is-blank" aria-hidden="true"></span>`);
    }
    for (let day = 1; day <= total; day += 1) {
      const iso = `${year}-${U.pad(month + 1)}-${U.pad(day)}`;
      const done = Boolean(habit.history[iso]);
      const future = iso > today;
      const isToday = iso === today;
      cells.push(`
        <button class="habit-cell${done ? " is-done" : ""}${isToday ? " is-today" : ""}${future ? " is-future" : ""}"
                type="button" style="--habit-color:${U.esc(habit.color)}"
                data-action="toggle-habit" data-id="${U.esc(habit.id)}" data-date="${iso}"
                ${future ? "disabled" : ""}
                aria-label="${U.esc(habit.name)}，${U.esc(U.dateCN(iso))}，${done ? "已打卡" : future ? "未来日期" : "未打卡"}"
                aria-pressed="${done ? "true" : "false"}">
          ${day}
        </button>`);
    }
    const trailing = (7 - ((leading + total) % 7)) % 7;
    for (let i = 0; i < trailing; i += 1) {
      cells.push(`<span class="habit-cell is-blank" aria-hidden="true"></span>`);
    }
    return `
      <div class="heatmap-weekdays">${U.WEEKDAYS_SHORT.map((day) => `<span>${day}</span>`).join("")}</div>
      <div class="habit-heatmap" role="group" aria-label="${U.esc(habit.name)} ${year} 年 ${month + 1} 月打卡记录">
        ${cells.join("")}
      </div>`;
  }

  function habitCard(habit, year, month) {
    const today = U.todayISO();
    const doneToday = Boolean(habit.history[today]);
    const streak = S.habitCurrentStreak(habit, today);
    const best = S.habitBestStreak(habit);
    const monthCount = S.habitMonthCount(habit, year, month);
    return `
      <section class="habit-card" style="--habit-color:${U.esc(habit.color)}">
        <div class="habit-top">
          <div class="habit-identity">
            <span class="habit-big-dot" aria-hidden="true"></span>
            <div>
              <button class="habit-name" type="button" data-action="edit-habit" data-id="${U.esc(habit.id)}">${U.esc(habit.name)}</button>
              <div class="habit-meta-line">
                <span class="streak">${icon("flame")}连续 ${streak} 天</span>
                <span>最长 ${best} 天</span>
                <span>${year} 年 ${month + 1} 月 ${monthCount} 次</span>
              </div>
            </div>
          </div>
          <div class="habit-today">
            <span class="habit-today-label">TODAY</span>
            <button class="check${doneToday ? " is-done" : ""}" type="button"
                    style="--event-color:${U.esc(habit.color)}"
                    data-action="toggle-habit" data-id="${U.esc(habit.id)}" data-date="${today}"
                    aria-label="${doneToday ? "取消今日打卡" : "完成今日打卡"}：${U.esc(habit.name)}"
                    aria-pressed="${doneToday ? "true" : "false"}">${icon("check")}</button>
            <div class="habit-actions">
              <button class="icon-btn icon-btn--small" type="button" data-action="edit-habit" data-id="${U.esc(habit.id)}" aria-label="编辑打卡：${U.esc(habit.name)}">${icon("edit")}</button>
              <button class="icon-btn icon-btn--small icon-btn--danger" type="button" data-action="delete-habit" data-id="${U.esc(habit.id)}" aria-label="删除打卡：${U.esc(habit.name)}">${icon("trash")}</button>
            </div>
          </div>
        </div>
        <div class="heatmap-block">
          ${heatmap(habit, year, month)}
          <p class="habit-hint">点击日期可补记或取消；未来日期不可打卡。</p>
        </div>
      </section>`;
  }

  function render() {
    const data = S.getState();
    const today = U.todayISO();
    const { year, month } = monthFromUI();
    const overview = S.habitOverview();
    const monthCheckins = data.habits.reduce((sum, habit) => sum + S.habitMonthCount(habit, year, month), 0);
    const cards = data.habits.map((habit) => habitCard(habit, year, month)).join("");
    const canGoNext = `${year}-${U.pad(month + 1)}` < U.monthKey(today);

    return `
      <header class="view-head">
        <div class="view-head-copy">
          <div class="eyebrow">DAILY PRACTICE · ${U.numericDate(today)}</div>
          <h1 class="view-title">日常打卡</h1>
          <p class="view-sub">每天留下一个颜色标记。完成就点亮当天，不需要解释，也不需要连续完美。</p>
        </div>
        <div class="view-actions">
          <button class="btn btn--primary" type="button" data-action="add-habit">${icon("plus")}新建打卡</button>
        </div>
      </header>

      <section class="habit-stats" aria-label="打卡概览">
        <div class="habit-stat"><strong>${overview.doneToday}/${overview.totalHabits}</strong><span>今日完成</span></div>
        <div class="habit-stat"><strong>${monthCheckins}</strong><span>${year} 年 ${month + 1} 月累计</span></div>
        <div class="habit-stat"><strong>${overview.currentStreak}</strong><span>当前最长连续（天）</span></div>
      </section>

      <div class="habit-toolbar">
        <div class="month-nav">
          <button class="icon-btn" type="button" data-action="habit-prev" aria-label="上个月">${icon("left")}</button>
          <strong>${year}.${U.pad(month + 1)}</strong>
          <button class="icon-btn" type="button" data-action="habit-next" aria-label="下个月" ${canGoNext ? "" : "disabled"}>${icon("right")}</button>
          <button class="btn btn--ghost btn--small" type="button" data-action="habit-today">回到本月</button>
        </div>
        <span class="section-kicker">${data.habits.length} 个习惯</span>
      </div>

      ${data.habits.length
        ? `<div class="habit-list">${cards}</div>`
        : `<div class="schedule-empty">${C.emptyState({
            icon: "habit",
            title: "还没有打卡项目",
            text: "从一件每天 10 分钟能完成的事开始，比如读一篇摘要。",
            action: `<button class="btn btn--primary btn--small" type="button" data-action="add-habit">${icon("plus")}新建第一个打卡</button>`
          })}</div>`}`;
  }

  YC.views = YC.views || {};
  YC.views.habits = { render, shiftMonth };
})();


/* ---- js/views/projects.js ---- */
(function () {
  "use strict";

  const YC = (window.YC = window.YC || {});
  const U = YC.utils;
  const S = YC.store;
  const C = YC.components;
  const icon = YC.ui.icon;

  function stageStatus(item) {
    if (item.complete) return "已完成";
    if (item.overdue) return "已逾期";
    if (item.active) return "进行中";
    return "未开始";
  }

  function stageStatusClass(item) {
    if (item.complete) return "pill--accent";
    if (item.overdue) return "pill--danger";
    if (item.active) return "pill--ochre";
    return "pill--quiet";
  }

  function stageRail(project, stats) {
    const stages = stats.steps.map((item) => {
      const step = item.step;
      return `
        <button class="${C.stageClasses(item)}" type="button"
                data-action="open-stage" data-project="${U.esc(project.id)}" data-step="${U.esc(step.id)}"
                aria-label="${U.esc(U.pad(item.index + 1))} ${U.esc(step.name)}，${stageStatus(item)}，完成 ${item.stats.done}/${item.stats.total}">
          <span class="stage-line${item.complete ? " is-done" : ""}" aria-hidden="true"></span>
          <span class="stage-dot">${item.complete ? icon("check") : U.pad(item.index + 1)}</span>
          <span class="stage-name">${U.esc(step.name)}</span>
          <span class="stage-count${item.stats.total ? "" : " is-muted"}">${C.stageCountText(item)}</span>
        </button>`;
    }).join("");
    return `<div class="stage-scroll"><div class="stage-rail">${stages}</div></div>`;
  }

  function projectCard(project) {
    const stats = S.projectStats(project);
    const firstStart = project.steps[0] ? project.steps[0].start : "";
    const lastEnd = project.steps[project.steps.length - 1] ? project.steps[project.steps.length - 1].end : "";
    const next = stats.next;
    const nextAction = next
      ? `data-action="open-stage" data-project="${U.esc(project.id)}" data-step="${U.esc(next.step.id)}"`
      : "";
    return `
      <article class="project-card" style="--project:${U.esc(project.color)}">
        <div class="project-head">
          <div class="project-identity">
            <span class="project-mark" aria-hidden="true"></span>
            <div>
              <h2 class="project-name">${U.esc(project.name)}</h2>
              <div class="project-meta">${U.esc(U.rangeLabel(firstStart, lastEnd))} · ${project.steps.length} 个阶段</div>
            </div>
          </div>
          <div class="project-score">
            <strong>${stats.pct}<small>%</small></strong>
            <span>总进度</span>
          </div>
        </div>

        <div class="project-bar">${C.progressBar(stats.pct, project.color, { thick: true })}</div>

        <div class="project-stage-head">
          <span>STAGES · 08</span>
          <small>${stats.completedStages} 个完成 · ${stats.emptyStages} 个待规划</small>
        </div>
        ${stageRail(project, stats)}

        <div class="project-next">
          <span class="project-next-label">NEXT</span>
          <p>${stats.allComplete
            ? "全部阶段已完成。可以回到日程，安排复盘或下一篇工作。"
            : `${C.nextActionText(stats.next)} ${next && next.overdue ? `<span class="pill pill--danger">已逾期</span>` : ""}`}</p>
        </div>

        <div class="project-foot">
          <span class="project-hint">总进度按 8 个阶段平均计算；空阶段计 0%。</span>
          <div class="row">
            ${next ? `<button class="btn btn--ghost btn--small" type="button" ${nextAction}>打开下一步 ${icon("arrow-right")}</button>` : ""}
            <button class="icon-btn icon-btn--small" type="button" data-action="edit-project" data-id="${U.esc(project.id)}" aria-label="编辑课题：${U.esc(project.name)}">${icon("edit")}</button>
            <button class="icon-btn icon-btn--small icon-btn--danger" type="button" data-action="delete-project" data-id="${U.esc(project.id)}" aria-label="删除课题：${U.esc(project.name)}">${icon("trash")}</button>
          </div>
        </div>
      </article>`;
  }

  function render() {
    const data = S.getState();
    const overall = S.overallProjectStats();
    const totalStages = data.projects.reduce((sum, project) => sum + project.steps.length, 0);
    const completedStages = overall.items
      ? overall.items.reduce((sum, item) => sum + item.stats.completedStages, 0)
      : 0;

    return `
      <header class="view-head">
        <div class="view-head-copy">
          <div class="eyebrow">RESEARCH TRACK · ${U.numericDate(U.todayISO())}</div>
          <h1 class="view-title">课题推进</h1>
          <p class="view-sub">从 Idea 到接收，把课题拆成八个阶段。每个阶段的子事项都来自你的日程，完成一项，进度就往前一格。</p>
        </div>
        <div class="view-actions">
          <button class="btn btn--primary" type="button" data-action="add-project">${icon("plus")}新建课题</button>
        </div>
      </header>

      <section class="project-stats" aria-label="课题概览">
        <div class="project-stat"><strong>${overall.active}</strong><span>进行中的课题</span></div>
        <div class="project-stat"><strong>${overall.pct}%</strong><span>平均总进度</span></div>
        <div class="project-stat"><strong>${completedStages}/${totalStages}</strong><span>已完成阶段</span></div>
      </section>

      ${data.projects.length
        ? `<div class="project-list">${data.projects.map(projectCard).join("")}</div>`
        : `<div class="schedule-empty">${C.emptyState({
            icon: "project",
            title: "还没有课题",
            text: "建立课题后，会自动生成八个阶段。日程关联到阶段后，完成日程就会推进进度。",
            action: `<button class="btn btn--primary btn--small" type="button" data-action="add-project">${icon("plus")}建立第一个课题</button>`
          })}</div>`}`;
  }

  function stageBody(project, step, index) {
    const stats = S.projectStats(project);
    const item = stats.steps[index];
    const stepStats = item.stats;
    const linkedCount = step.subtasks.filter((subtask) => subtask.sourceEventId).length;
    const subtasks = step.subtasks.length
      ? step.subtasks.map((subtask) => {
          const event = subtask.sourceEventId ? S.getEvent(subtask.sourceEventId) : null;
          return `
            <div class="subtask-row${subtask.done ? " is-done" : ""}">
              <button class="check${subtask.done ? " is-done" : ""}" type="button"
                      style="--event-color:${U.esc(project.color)}"
                      data-action="toggle-subtask" data-project="${U.esc(project.id)}" data-step="${U.esc(step.id)}" data-subtask="${U.esc(subtask.id)}"
                      aria-label="${subtask.done ? "标记未完成" : "标记完成"}：${U.esc(subtask.title)}"
                      aria-pressed="${subtask.done ? "true" : "false"}">${icon("check")}</button>
              <div class="subtask-main">
                <div class="subtask-title">${U.esc(subtask.title)}</div>
                <div class="subtask-meta">
                  ${subtask.date ? `<span>${U.esc(U.dateCN(subtask.date))}</span>` : ""}
                  ${event ? `<span class="source-badge">${icon("link")}日程同步</span>` : ""}
                  ${event ? `<span>${U.esc(U.timeRange(event.start, event.end))}</span>` : ""}
                </div>
              </div>
              <button class="icon-btn icon-btn--small icon-btn--danger" type="button"
                      data-action="delete-subtask" data-project="${U.esc(project.id)}" data-step="${U.esc(step.id)}" data-subtask="${U.esc(subtask.id)}"
                      aria-label="删除子事项：${U.esc(subtask.title)}">${icon("trash")}</button>
            </div>`;
        }).join("")
      : `<div class="stage-empty">
           <strong>这个阶段还没有子事项</strong>
           <p>添加子事项，或在日程中关联到本阶段。也可以直接标记阶段完成。</p>
           <button class="btn btn--secondary btn--small" type="button"
                   data-action="complete-empty-stage" data-project="${U.esc(project.id)}" data-step="${U.esc(step.id)}">
             ${icon("check")}标记阶段完成
           </button>
         </div>`;

    return `
      <div class="stage-summary">
        <div class="stage-summary-main">
          <div class="stage-summary-sub">计划 ${U.esc(U.rangeLabel(step.start, step.end))} · ${stepStats.done}/${stepStats.total} 项完成${linkedCount ? ` · ${linkedCount} 项来自日程` : ""}</div>
        </div>
        <div class="stage-ring" style="--pct:${stepStats.pct};--project:${U.esc(project.color)}" aria-label="阶段进度 ${stepStats.pct}%">
          <span>${stepStats.pct}%</span>
        </div>
      </div>

      <form class="stage-dates" data-form="stage-dates" data-project="${U.esc(project.id)}" data-step="${U.esc(step.id)}">
        <div class="field">
          <label for="stage-start">开始日期</label>
          <input class="input" id="stage-start" type="date" name="start" value="${U.esc(step.start)}" required>
        </div>
        <div class="field">
          <label for="stage-end">结束日期</label>
          <input class="input" id="stage-end" type="date" name="end" value="${U.esc(step.end)}" required>
        </div>
        <button class="btn btn--secondary btn--small" type="submit">保存日期</button>
      </form>

      <div class="stage-subhead">
        <h4>子事项</h4>
        <span>${stepStats.done}/${stepStats.total} · ${stageStatus(item)}</span>
      </div>
      <div class="subtask-list">${subtasks}</div>

      <form class="subtask-add" data-form="subtask-add" data-project="${U.esc(project.id)}" data-step="${U.esc(step.id)}">
        <input class="input" type="text" name="title" maxlength="180" placeholder="添加一个子事项…" aria-label="子事项名称" required>
        <input class="input" type="date" name="date" value="${U.esc(step.start)}" aria-label="子事项日期">
        <button class="btn btn--primary btn--small" type="submit">${icon("plus")}添加</button>
      </form>

      <div class="stage-note">
        ${icon("link")}
        <span>在日程中关联到本阶段，会自动出现在这里；勾选任意一侧，另一侧同步更新。</span>
      </div>`;
  }

  function stageConfig(projectId, stepId) {
    const project = S.getProject(projectId);
    if (!project) return null;
    const index = project.steps.findIndex((step) => step.id === stepId);
    if (index < 0) return null;
    const step = project.steps[index];
    const stats = S.projectStats(project);
    const item = stats.steps[index];
    return {
      key: "stage",
      projectId,
      stepId,
      kicker: "阶段详情",
      title: `${U.pad(index + 1)} ${U.esc(step.name)}`,
      sub: `${U.esc(project.name)} · ${stageStatus(item)}`,
      body: stageBody(project, step, index),
      footer: `<button class="btn btn--secondary" type="button" data-action="close-modal">关闭</button>`,
      wide: true
    };
  }

  function refreshStage(projectId, stepId) {
    const current = YC.ui.currentModal();
    if (!current || current.key !== "stage") return;
    const next = stageConfig(projectId, stepId);
    if (!next) return;
    Object.assign(current, next);
    YC.ui.refreshModal();
  }

  function stageStatusText(projectId, stepId) {
    const project = S.getProject(projectId);
    if (!project) return "";
    const index = project.steps.findIndex((step) => step.id === stepId);
    if (index < 0) return "";
    return stageStatus(S.projectStats(project).steps[index]);
  }

  YC.views = YC.views || {};
  YC.views.projects = {
    render,
    stageConfig,
    refreshStage,
    stageStatusText
  };
})();


/* ---- js/views/sparks.js ---- */
(function () {
  "use strict";

  const YC = (window.YC = window.YC || {});
  const U = YC.utils;
  const S = YC.store;
  const C = YC.components;
  const icon = YC.ui.icon;

  function localISO(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? U.todayISO() : U.toISO(date);
  }

  function typePill(spark) {
    const type = U.sparkType(spark.type);
    return `<span class="spark-type spark-type--${U.esc(type.key)}">${U.esc(type.label)}</span>`;
  }

  function filterButton(key, label, active) {
    return `
      <button class="spark-filter${active ? " is-active" : ""}" type="button"
              data-action="set-spark-filter" data-filter="${U.esc(key)}"
              aria-pressed="${active ? "true" : "false"}">${U.esc(label)}</button>`;
  }

  function sparkCard(spark, dailyId) {
    const isDaily = spark.id === dailyId;
    const created = localISO(spark.createdAt);
    return `
      <article class="spark-card${isDaily ? " is-daily" : ""}" data-spark-id="${U.esc(spark.id)}">
        <div class="spark-card-head">
          ${typePill(spark)}
          ${isDaily ? `<span class="spark-daily-badge">${icon("spark")}今日抽取</span>` : ""}
          <span class="spark-date">${U.esc(U.dateCompact(created))}</span>
        </div>
        <p class="spark-content">${U.esc(spark.content)}</p>
        <div class="spark-card-foot">
          <button class="spark-remind-toggle${spark.remind ? " is-on" : ""}" type="button"
                  data-action="toggle-spark-remind" data-id="${U.esc(spark.id)}"
                  aria-pressed="${spark.remind ? "true" : "false"}"
                  aria-label="${spark.remind ? "取消每日提醒" : "设为每日提醒"}：${U.esc(spark.content.slice(0, 40))}">
            ${icon("bell")}<span>${spark.remind ? "每日提醒" : "设为提醒"}</span>
          </button>
          <div class="spark-actions">
            <button class="icon-btn icon-btn--small" type="button" data-action="edit-spark" data-id="${U.esc(spark.id)}" aria-label="编辑闪念：${U.esc(spark.content.slice(0, 40))}">${icon("edit")}</button>
            <button class="icon-btn icon-btn--small icon-btn--danger" type="button" data-action="delete-spark" data-id="${U.esc(spark.id)}" aria-label="删除闪念：${U.esc(spark.content.slice(0, 40))}">${icon("trash")}</button>
          </div>
        </div>
      </article>`;
  }

  function render() {
    const data = S.getState();
    const today = U.todayISO();
    const overview = S.sparkOverview();
    const daily = S.dailySpark(today);
    const filter = YC.app.ui.sparkFilter || "all";
    const onlyRemind = Boolean(YC.app.ui.sparkRemindOnly);
    const sorted = data.sparks.slice().sort((a, b) => {
      const dateCompare = String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
      return dateCompare !== 0 ? dateCompare : String(a.id).localeCompare(String(b.id));
    });
    const filtered = sorted.filter((spark) => {
      if (filter !== "all" && spark.type !== filter) return false;
      if (onlyRemind && !spark.remind) return false;
      return true;
    });
    const typeButtons = [
      filterButton("all", "全部", filter === "all"),
      ...U.SPARK_TYPES.map((type) => filterButton(type.key, type.label, filter === type.key))
    ].join("");
    const cards = filtered.map((spark) => sparkCard(spark, daily.spark && daily.spark.id)).join("");

    return `
      <header class="view-head">
        <div class="view-head-copy">
          <div class="eyebrow">FLASH NOTES · ${U.numericDate(today)}</div>
          <h1 class="view-title">闪念</h1>
          <p class="view-sub">记下经验、灵感、解法，或此刻的心情。勾选「每日提醒」的条目，会每天随机出现在「今天」标题右侧。</p>
        </div>
        <div class="view-actions">
          <button class="btn btn--primary" type="button" data-action="add-spark">${icon("plus")}记录闪念</button>
        </div>
      </header>

      <section class="spark-stats" aria-label="闪念概览">
        <div class="spark-stat"><strong>${overview.total}</strong><span>全部记录</span></div>
        <div class="spark-stat"><strong>${overview.reminders}</strong><span>每日提醒中</span></div>
        <div class="spark-stat"><strong>${overview.weekAdded}</strong><span>近 7 天新增</span></div>
      </section>

      <div class="spark-toolbar">
        <div class="spark-filters" role="group" aria-label="按类型筛选">${typeButtons}</div>
        <button class="spark-remind-filter${onlyRemind ? " is-active" : ""}" type="button"
                data-action="toggle-spark-remind-filter" aria-pressed="${onlyRemind ? "true" : "false"}">
          ${icon("bell")}只看提醒 <span>${overview.reminders}</span>
        </button>
      </div>

      ${filtered.length
        ? `<div class="spark-grid">${cards}</div>`
        : `<div class="schedule-empty">${C.emptyState({
            icon: "spark",
            title: data.sparks.length ? "当前筛选没有内容" : "还没有闪念",
            text: data.sparks.length
              ? "换一个类型，或关闭「只看提醒」。"
              : "先把一条经验或灵感写下来。它可以在明天提醒你一次。",
            action: data.sparks.length
              ? `<button class="btn btn--secondary btn--small" type="button" data-action="reset-spark-filter">清除筛选</button>`
              : `<button class="btn btn--primary btn--small" type="button" data-action="add-spark">${icon("plus")}记录第一条闪念</button>`
          })}</div>`}`;
  }

  YC.views = YC.views || {};
  YC.views.sparks = { render };
})();


/* ---- js/gist-sync.js ---- */
(function () {
  "use strict";

  const YC = (window.YC = window.YC || {});
  const U = YC.utils;
  const S = YC.store;
  const icon = YC.ui.icon;

  const API = "https://api.github.com";
  const FILE_NAME = "yancheng-state.json";
  const CONFIG_KEY = "yancheng.gist.v1";
  const AUTO_INTERVAL = 2 * 60 * 1000;

  const LABELS = {
    idle: "已连接",
    syncing: "同步中…",
    ok: "已同步",
    dirty: "本地有未同步修改",
    offline: "离线，等待网络",
    error: "同步失败",
    conflict: "需要选择保留版本"
  };

  let config = loadConfig();
  let status = { state: connected() ? "idle" : "off", message: "" };
  let syncing = false;
  let pending = false;
  let applyingRemote = false;
  let conflictOpen = false;
  let pendingConflict = null;
  let timer = null;

  function defaults() {
    return { token: "", gistId: "", enabled: true, lastSyncedHash: "", lastSyncAt: "" };
  }

  function loadConfig() {
    try {
      const raw = JSON.parse(window.localStorage.getItem(CONFIG_KEY) || "{}");
      return Object.assign(defaults(), raw, { enabled: raw.enabled !== false });
    } catch (error) {
      return defaults();
    }
  }

  function saveConfig() {
    try {
      window.localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
    } catch (error) {
      YC.ui.toast("同步设置无法保存：浏览器存储不可用", { type: "error" });
    }
  }

  function connected() {
    return Boolean(config.token && config.gistId);
  }

  function autoOn() {
    return connected() && config.enabled;
  }

  function refreshSettingsUI() {
    const current = YC.ui.currentModal && YC.ui.currentModal();
    if (current && current.key === "settings" && YC.app && typeof YC.app.refreshSettings === "function") {
      YC.app.refreshSettings();
    }
  }

  function setStatus(state, message) {
    status = { state, message: message || "" };
    refreshSettingsUI();
  }

  function formatTime(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "";
    return date.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function countsOf(state) {
    if (!state) return "0 日程 · 0 打卡 · 0 课题 · 0 闪念";
    return `${state.events ? state.events.length : 0} 日程 · ${state.habits ? state.habits.length : 0} 打卡 · ${state.projects ? state.projects.length : 0} 课题 · ${state.sparks ? state.sparks.length : 0} 闪念`;
  }

  function statusClass() {
    if (!config.enabled && !["syncing", "error", "conflict", "dirty"].includes(status.state)) return "paused";
    return status.state === "off" ? "idle" : status.state;
  }

  function settingsHTML() {
    if (!connected()) {
      return `
        <div class="sync-box">
          <p class="settings-copy">把日程、打卡、课题和闪念同步到 GitHub Gist。创建新 Gist 时，会先上传当前本机数据；连接已有 Gist 时，会以云端数据覆盖本机。</p>
          <div class="field" style="margin-top:12px">
            <label for="gist-token">GitHub Token</label>
            <input class="input" id="gist-token" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_… 或 github_pat_…">
            <p class="field-hint">需要 Gists 读写权限。Classic token 勾选 <code>gist</code>；fine-grained token 在 Account permissions → Gists 选择 Read and write。<a class="text-link" href="https://github.com/settings/tokens/new?scopes=gist&description=YanCheng" target="_blank" rel="noopener">创建 token</a></p>
          </div>
          <div class="field" style="margin-top:12px">
            <label for="gist-id">Gist ID（连接已有 Gist 时填写）</label>
            <input class="input" id="gist-id" type="text" autocomplete="off" spellcheck="false" placeholder="也可以直接粘贴 Gist 链接">
          </div>
          <div class="sync-actions">
            <button class="btn btn--primary btn--small" type="button" data-action="gist-create">${icon("upload")}创建新 Gist 并上传</button>
            <button class="btn btn--secondary btn--small" type="button" data-action="gist-connect">${icon("download")}连接已有 Gist</button>
          </div>
          <div class="sync-inline" id="gist-inline-status" hidden></div>
          <p class="sync-warning">Secret Gist 不会公开列出，但任何拿到链接的人都能读取。不要同步高度敏感内容。Token 只保存在当前浏览器，不会写入 JSON 备份。</p>
        </div>`;
    }

    return `
      <div class="sync-box" id="gist-settings">
        <div class="sync-status-line">
          <span class="sync-dot is-${statusClass()}" aria-hidden="true"></span>
          <strong>${LABELS[status.state] || "已连接"}</strong>
          ${config.lastSyncAt ? `<span class="sync-time">${U.esc(formatTime(config.lastSyncAt))}</span>` : ""}
        </div>
        <p class="settings-copy sync-meta">Gist <code class="gist-id">${U.esc(config.gistId)}</code><button class="sync-copy" type="button" data-action="gist-copy-id" aria-label="复制 Gist ID">${icon("copy")}</button> · ${config.enabled ? "自动同步已开启" : "自动同步已暂停"}</p>
        ${status.message ? `<p class="sync-message">${U.esc(status.message)}</p>` : ""}
        <div class="sync-actions">
          <button class="btn btn--secondary btn--small" type="button" data-action="gist-sync-now">立即同步</button>
          <button class="btn btn--ghost btn--small" type="button" data-action="gist-toggle-auto">${config.enabled ? "暂停自动同步" : "开启自动同步"}</button>
          <button class="btn btn--ghost btn--small" type="button" data-action="gist-push">上传本地覆盖云端</button>
          <button class="btn btn--ghost btn--small" type="button" data-action="gist-pull">从云端恢复</button>
          <button class="btn btn--ghost btn--small sync-disconnect" type="button" data-action="gist-disconnect">断开</button>
        </div>
        <p class="sync-warning">Secret Gist 不公开列出，但拿到链接的人可以读。自动同步开启时，本机的修改会在一小段时间后上传；清空或导入数据也会同步到云端。Token 只保存在当前浏览器。</p>
      </div>`;
  }

  function readToken() {
    const element = document.getElementById("gist-token");
    return element ? element.value.trim() : "";
  }

  function readGistId() {
    const element = document.getElementById("gist-id");
    return element ? normalizeGistId(element.value) : "";
  }

  function normalizeGistId(value) {
    let text = String(value || "").trim();
    if (!text) return "";
    try {
      if (/^https?:\/\//i.test(text)) {
        const url = new URL(text);
        text = url.pathname.split("/").filter(Boolean).pop() || "";
      }
    } catch (error) {
      // Fall through to the plain ID path.
    }
    return text.split(/[?#]/)[0].replace(/\/+$/, "").split("/").pop() || "";
  }

  function setInline(message, isError) {
    const element = document.getElementById("gist-inline-status");
    if (!element) return;
    element.hidden = false;
    element.className = `sync-inline${isError ? " is-error" : ""}`;
    element.textContent = message;
  }

  async function request(path, options) {
    const opts = options || {};
    const headers = {
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
    const token = opts.token || config.token;
    if (token) headers.Authorization = `Bearer ${token}`;
    if (opts.body) headers["Content-Type"] = "application/json";
    let response;
    try {
      response = await fetch(`${API}${path}`, {
        method: opts.method || "GET",
        headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
        cache: "no-store"
      });
    } catch (error) {
      throw new Error("网络请求失败，请检查 GitHub 是否可访问");
    }
    if (!response.ok) {
      let detail = "";
      try {
        const body = await response.json();
        detail = body && body.message ? `：${body.message}` : "";
      } catch (error) {
        // Ignore non-JSON error bodies.
      }
      if (response.status === 401) throw new Error("GitHub token 无效");
      if (response.status === 403) throw new Error(`token 权限不足或 GitHub API 限流${detail}`);
      if (response.status === 404) throw new Error("Gist 不存在，或 token 无权访问");
      if (response.status === 422) throw new Error(`GitHub 拒绝了同步请求${detail}`);
      throw new Error(`GitHub 返回 ${response.status}${detail}`);
    }
    return response.json();
  }

  async function hashState(state) {
    const text = JSON.stringify(state);
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      const buffer = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buffer)).map((byte) => byte.toString(16).padStart(2, "0")).join("");
    }
    let hash = 2166136261;
    for (let index = 0; index < text.length; index += 1) {
      hash ^= text.charCodeAt(index);
      hash = Math.imul(hash, 16777619);
    }
    return (hash >>> 0).toString(16);
  }

  function serializeLocal() {
    return S.exportJSON();
  }

  async function createGist(token) {
    return request("/gists", {
      method: "POST",
      token,
      body: {
        description: "研程 · 科研日程同步",
        public: false,
        files: { [FILE_NAME]: { content: serializeLocal() } }
      }
    });
  }

  async function fetchRemote(token, gistId) {
    const gist = await request(`/gists/${encodeURIComponent(gistId)}`, { token });
    const file = gist.files && gist.files[FILE_NAME];
    if (!file) return { exists: false, gist };
    if (file.truncated) throw new Error("云端文件超过 GitHub API 返回上限，暂无法读取");
    let parsed;
    try {
      parsed = JSON.parse(file.content);
    } catch (error) {
      throw new Error("云端同步文件不是有效 JSON");
    }
    const state = parsed && parsed.data ? parsed.data : parsed;
    if (!state || typeof state !== "object") throw new Error("云端同步文件格式无法识别");
    return {
      exists: true,
      gist,
      content: file.content,
      state,
      hash: await hashState(state),
      counts: parsed.counts || null,
      updatedAt: gist.updated_at
    };
  }

  async function pushLocal() {
    const content = serializeLocal();
    const hash = await hashState(S.getState());
    await request(`/gists/${encodeURIComponent(config.gistId)}`, {
      method: "PATCH",
      body: { files: { [FILE_NAME]: { content } } }
    });
    config.lastSyncedHash = hash;
    config.lastSyncAt = new Date().toISOString();
    saveConfig();
    setStatus("ok");
    return true;
  }

  async function applyRemote(remote, manual) {
    applyingRemote = true;
    try {
      S.importJSON(remote.content);
      config.lastSyncedHash = remote.hash;
      config.lastSyncAt = new Date().toISOString();
      saveConfig();
      setStatus("ok");
      if (manual) YC.ui.toast("已从云端恢复");
      return true;
    } finally {
      applyingRemote = false;
    }
  }

  function scheduleSync(delay) {
    if (!autoOn()) return;
    if (timer) window.clearTimeout(timer);
    timer = window.setTimeout(() => {
      timer = null;
      if (autoOn() && status.state !== "conflict") void syncNow({ automatic: true });
    }, delay);
  }

  async function syncNow(options) {
    const opts = options || {};
    if (!connected()) return false;
    if (syncing) {
      pending = true;
      return false;
    }
    if (!navigator.onLine) {
      setStatus("offline");
      if (opts.manual) YC.ui.toast("当前没有网络", { type: "error" });
      return false;
    }
    if (status.state === "conflict" && !opts.manual) return false;

    syncing = true;
    setStatus("syncing");
    try {
      const remote = await fetchRemote(null, config.gistId);
      if (!remote.exists) {
        await pushLocal();
        if (opts.manual) YC.ui.toast("云端还没有数据，已上传本地");
        return true;
      }
      const localHash = await hashState(S.getState());
      if (remote.hash === localHash) {
        config.lastSyncedHash = localHash;
        config.lastSyncAt = new Date().toISOString();
        saveConfig();
        setStatus("ok");
        if (opts.manual) YC.ui.toast("已是最新");
        return true;
      }
      if (!config.lastSyncedHash) {
        showConflict(remote, localHash);
        return false;
      }
      if (remote.hash === config.lastSyncedHash) {
        await pushLocal();
        if (opts.manual) YC.ui.toast("已上传本地修改");
        return true;
      }
      if (localHash === config.lastSyncedHash) {
        await applyRemote(remote, opts.manual);
        return true;
      }
      showConflict(remote, localHash);
      return false;
    } catch (error) {
      setStatus("error", error.message || "同步失败");
      if (opts.manual) YC.ui.toast(error.message || "同步失败", { type: "error", duration: 4200 });
      return false;
    } finally {
      syncing = false;
      if (pending) {
        pending = false;
        scheduleSync(800);
      }
    }
  }

  function showConflict(remote, localHash) {
    if (conflictOpen) return;
    conflictOpen = true;
    pendingConflict = { remote, localHash };
    setStatus("conflict", "云端和本地都有修改");
    YC.ui.openModal({
      key: "gist-conflict",
      kicker: "SYNC CONFLICT",
      title: "云端和本地都有修改",
      sub: "选择一份数据继续同步。选择后另一份会被覆盖。",
      body: `
        <div class="sync-conflict">
          <div class="sync-conflict-grid">
            <div class="sync-conflict-card">
              <span>云端 Gist</span>
              <strong>${U.esc(countsOf(remote.state))}</strong>
              <small>更新于 ${U.esc(formatTime(remote.updatedAt) || "未知时间")}</small>
            </div>
            <div class="sync-conflict-card">
              <span>本机</span>
              <strong>${U.esc(countsOf(S.getState()))}</strong>
              <small>当前浏览器中的数据</small>
            </div>
          </div>
          <p class="sync-warning">建议先到「数据与备份」导出一份本地 JSON，再选择。</p>
        </div>`,
      footer: `
        <button class="btn btn--ghost" type="button" data-action="gist-conflict-cancel">稍后处理</button>
        <button class="btn btn--secondary" type="button" data-action="gist-conflict-push">${icon("upload")}保留本地</button>
        <button class="btn btn--primary" type="button" data-action="gist-conflict-pull">${icon("download")}使用云端</button>`
    });
  }

  async function createAndConnect(token) {
    setInline("正在创建 Gist…");
    try {
      const gist = await createGist(token);
      const hash = await hashState(S.getState());
      config = { token, gistId: gist.id, enabled: true, lastSyncedHash: hash, lastSyncAt: new Date().toISOString() };
      saveConfig();
      setStatus("ok");
      refreshSettingsUI();
      YC.ui.toast("Gist 已创建并上传");
    } catch (error) {
      setInline(error.message || "创建失败", true);
      YC.ui.toast(error.message || "创建失败", { type: "error", duration: 4200 });
    }
  }

  async function previewConnect(token, gistId) {
    setInline("正在读取云端…");
    try {
      const remote = await fetchRemote(token, gistId);
      if (!remote.exists) {
        setInline("这个 Gist 中没有研程同步文件", true);
        return;
      }
      setInline("");
      const element = document.getElementById("gist-inline-status");
      if (element) element.hidden = true;
      YC.ui.confirm({
        title: "连接已有 Gist？",
        message: `云端有 ${countsOf(remote.state)}。连接后会以云端数据覆盖本机当前数据，建议先导出本机备份。`,
        confirmLabel: "连接并拉取",
        onConfirm: () => {
          void connectAndPull(token, gistId, remote);
        }
      });
    } catch (error) {
      setInline(error.message || "读取失败", true);
      YC.ui.toast(error.message || "读取失败", { type: "error", duration: 4200 });
    }
  }

  async function connectAndPull(token, gistId, remote) {
    applyingRemote = true;
    try {
      S.importJSON(remote.content);
      config = { token, gistId, enabled: true, lastSyncedHash: remote.hash, lastSyncAt: new Date().toISOString() };
      saveConfig();
      setStatus("ok");
      refreshSettingsUI();
      YC.ui.toast("已连接并从云端拉取");
    } catch (error) {
      setInline(error.message || "连接失败", true);
      YC.ui.toast(error.message || "连接失败", { type: "error", duration: 4200 });
    } finally {
      applyingRemote = false;
    }
  }

  async function pushManual() {
    if (!connected()) return;
    setStatus("syncing");
    try {
      await pushLocal();
      YC.ui.toast("已用本地覆盖云端");
    } catch (error) {
      setStatus("error", error.message || "上传失败");
      YC.ui.toast(error.message || "上传失败", { type: "error", duration: 4200 });
    }
  }

  async function pullManual() {
    if (!connected()) return;
    setStatus("syncing");
    try {
      const remote = await fetchRemote(null, config.gistId);
      if (!remote.exists) throw new Error("云端还没有研程同步文件");
      await applyRemote(remote, true);
    } catch (error) {
      setStatus("error", error.message || "下载失败");
      YC.ui.toast(error.message || "下载失败", { type: "error", duration: 4200 });
    }
  }

  function handle(action, element) {
    switch (action) {
      case "gist-create": {
        const token = readToken();
        if (!token) {
          setInline("请先填写 GitHub Token", true);
          return true;
        }
        YC.ui.confirm({
          title: "创建并上传到 Gist？",
          message: "当前全部数据会写入一个新的 Secret Gist。Secret Gist 不公开列出，但拿到链接的人可以读取。继续？",
          confirmLabel: "创建并上传",
          onConfirm: () => { void createAndConnect(token); }
        });
        return true;
      }
      case "gist-connect": {
        const token = readToken();
        const gistId = readGistId();
        if (!token) {
          setInline("请先填写 GitHub Token", true);
          return true;
        }
        if (!gistId) {
          setInline("请填写 Gist ID 或粘贴 Gist 链接", true);
          return true;
        }
        void previewConnect(token, gistId);
        return true;
      }
      case "gist-copy-id":
        if (!config.gistId) return true;
        void YC.ui.copyText(config.gistId).then((ok) => {
          YC.ui.toast(ok ? "Gist ID 已复制" : "无法自动复制，请手动选择 Gist ID", { type: ok ? "success" : "error" });
        });
        return true;
      case "gist-sync-now":
        void syncNow({ manual: true });
        return true;
      case "gist-toggle-auto":
        if (!connected()) return true;
        config.enabled = !config.enabled;
        saveConfig();
        setStatus("idle");
        YC.ui.toast(config.enabled ? "自动同步已开启" : "自动同步已暂停", { type: "info" });
        if (config.enabled) void syncNow({ manual: false });
        return true;
      case "gist-push":
        YC.ui.confirm({
          title: "用本地覆盖云端？",
          message: "其他设备尚未同步的修改会丢失。确定要用当前本机数据覆盖 Gist？",
          confirmLabel: "覆盖云端",
          onConfirm: () => { void pushManual(); }
        });
        return true;
      case "gist-pull":
        YC.ui.confirm({
          title: "从云端恢复？",
          message: "本机尚未同步的修改会丢失。确定要用云端数据覆盖当前本机？",
          confirmLabel: "使用云端",
          onConfirm: () => { void pullManual(); }
        });
        return true;
      case "gist-disconnect":
        YC.ui.confirm({
          title: "断开 GitHub 同步？",
          message: "断开后不再自动同步，云端 Gist 不会被删除。之后可以重新连接。",
          confirmLabel: "断开同步",
          onConfirm: () => {
            config = defaults();
            saveConfig();
            setStatus("off");
            refreshSettingsUI();
            YC.ui.toast("已断开同步，云端 Gist 未删除", { type: "info" });
          }
        });
        return true;
      case "gist-conflict-pull": {
        const conflict = pendingConflict;
        YC.ui.closeTop();
        conflictOpen = false;
        pendingConflict = null;
        if (conflict) void applyRemote(conflict.remote, true);
        return true;
      }
      case "gist-conflict-push":
        YC.ui.closeTop();
        conflictOpen = false;
        pendingConflict = null;
        void pushManual();
        return true;
      case "gist-conflict-cancel":
        YC.ui.closeTop();
        conflictOpen = false;
        setStatus("conflict", "待选择保留版本");
        return true;
      default:
        return false;
    }
  }

  document.addEventListener("yc:ready", () => {
    if (connected() && config.enabled) scheduleSync(800);
  });

  document.addEventListener("yc:change", () => {
    if (applyingRemote || !connected()) return;
    if (!config.enabled) return;
    if (status.state === "conflict") return;
    setStatus("dirty");
    if (syncing) {
      pending = true;
      return;
    }
    scheduleSync(1800);
  });

  window.addEventListener("online", () => {
    if (autoOn()) scheduleSync(500);
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && autoOn()) scheduleSync(400);
  });

  window.setInterval(() => {
    if (!document.hidden && autoOn() && status.state !== "conflict") {
      void syncNow({ automatic: true });
    }
  }, AUTO_INTERVAL);

  YC.gistSync = {
    settingsHTML,
    handle,
    syncNow,
    getConfig: () => ({ token: config.token, gistId: config.gistId, enabled: config.enabled, lastSyncAt: config.lastSyncAt }),
    getStatus: () => ({ state: status.state, message: status.message, connected: connected(), enabled: config.enabled })
  };
})();

  YC.settings = { config, confirmImport };
})();
