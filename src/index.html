<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>研程</title>
  <meta name="description" content="研程：把科研拆成今天能做完的事。日程、习惯、课题推进与闪念，本地优先。">
  <meta name="theme-color" content="#12261C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="研程">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap">
  <!-- INLINE:CSS -->
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></symbol>
    <symbol id="i-habit" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-project" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-4 3 3 5-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 21h16"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4.4 0 7-2.9 7-6.5 0-2.5-1.4-4.8-3.5-6.5-.5 2-1.6 3.2-3 4 .2-3.5-1.3-6.6-4-8.5.2 3.8-3.5 6.4-3.5 11 0 3.6 2.6 6.5 7 6.5Z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-columns" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2l1.7 6.3L20 10l-6.3 1.7L12 18l-1.7-6.3L4 10l6.3-1.7L12 2Z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></symbol>
  </svg>

  <button class="skip-link" type="button" data-action="skip-main">跳到主要内容</button>

  <div class="app">
    <aside class="rail" aria-label="主导航">
      <a class="brand" href="#today" aria-label="研程首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <path d="M6 29.5 12.8 22l5.8 4.1L30 11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="29.5" r="2.1" fill="currentColor"/>
            <circle cx="12.8" cy="22" r="2.1" fill="currentColor"/>
            <circle cx="18.6" cy="26.1" r="2.1" fill="currentColor"/>
            <circle cx="30" cy="11" r="2.6" fill="#D5A656"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>研程</strong>
          <small>RESEARCH RHYTHM</small>
        </span>
      </a>

      <div class="rail-date">
        <span class="rail-date-label">TODAY</span>
        <strong id="rail-date">—</strong>
        <span id="rail-weekday">—</span>
      </div>

      <nav class="rail-nav">
        <a class="nav-item" data-nav="today" href="#today">
          <svg class="icon"><use href="#i-today"></use></svg>
          <span>今天</span>
          <span class="nav-dot" aria-hidden="true"></span>
        </a>
        <a class="nav-item" data-nav="schedule" href="#schedule">
          <svg class="icon"><use href="#i-calendar"></use></svg>
          <span>日程</span>
          <span class="nav-dot" aria-hidden="true"></span>
        </a>
        <a class="nav-item" data-nav="habits" href="#habits">
          <svg class="icon"><use href="#i-habit"></use></svg>
          <span>日常打卡</span>
          <span class="nav-dot" aria-hidden="true"></span>
        </a>
        <a class="nav-item" data-nav="projects" href="#projects">
          <svg class="icon"><use href="#i-project"></use></svg>
          <span>课题推进</span>
          <span class="nav-dot" aria-hidden="true"></span>
        </a>
        <a class="nav-item" data-nav="sparks" href="#sparks">
          <svg class="icon"><use href="#i-spark"></use></svg>
          <span>闪念</span>
          <span class="nav-dot" aria-hidden="true"></span>
        </a>
      </nav>

      <div class="rail-lower">
        <div class="rail-pulse" id="rail-pulse"></div>
        <button class="rail-link" data-action="open-settings" type="button">
          <svg class="icon"><use href="#i-database"></use></svg>
          <span>数据与备份</span>
        </button>
        <button class="rail-link" data-action="toggle-theme" type="button" id="theme-button">
          <svg class="icon"><use href="#i-moon"></use></svg>
          <span id="theme-label">切换主题</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="mobile-bar">
        <a class="brand brand--compact" href="#today" aria-label="研程首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <path d="M6 29.5 12.8 22l5.8 4.1L30 11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="6" cy="29.5" r="2.1" fill="currentColor"/>
              <circle cx="12.8" cy="22" r="2.1" fill="currentColor"/>
              <circle cx="18.6" cy="26.1" r="2.1" fill="currentColor"/>
              <circle cx="30" cy="11" r="2.6" fill="#D5A656"/>
            </svg>
          </span>
          <span class="brand-copy"><strong>研程</strong><small>RESEARCH RHYTHM</small></span>
        </a>
        <div class="mobile-actions">
          <button class="icon-btn" type="button" data-action="open-settings" aria-label="数据与备份">
            <svg class="icon"><use href="#i-database"></use></svg>
          </button>
          <button class="icon-btn" type="button" data-action="toggle-theme" aria-label="切换主题">
            <svg class="icon"><use href="#i-moon"></use></svg>
          </button>
        </div>
      </header>

      <div id="view-root" class="view-root" tabindex="-1"></div>
    </main>

    <button class="fab" type="button" data-action="add-event" aria-label="新建日程">
      <svg class="icon"><use href="#i-plus"></use></svg>
    </button>

    <nav class="bottom-nav" aria-label="主导航">
      <a class="bottom-item" data-nav="today" href="#today">
        <svg class="icon"><use href="#i-today"></use></svg><span>今天</span>
      </a>
      <a class="bottom-item" data-nav="schedule" href="#schedule">
        <svg class="icon"><use href="#i-calendar"></use></svg><span>日程</span>
      </a>
      <a class="bottom-item" data-nav="habits" href="#habits">
        <svg class="icon"><use href="#i-habit"></use></svg><span>打卡</span>
      </a>
      <a class="bottom-item" data-nav="projects" href="#projects">
        <svg class="icon"><use href="#i-project"></use></svg><span>课题</span>
      </a>
      <a class="bottom-item" data-nav="sparks" href="#sparks">
        <svg class="icon"><use href="#i-spark"></use></svg><span>闪念</span>
      </a>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <!-- INLINE:JS -->
</body>
</html>
